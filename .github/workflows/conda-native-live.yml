name: Conda macOS and Windows live boundary

on:
  schedule:
    - cron: "37 2 * * 3"
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_TOOLCHAIN: 1.88.0

jobs:
  native:
    name: Conda (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: macOS x86_64, runner: macos-15-intel, architecture: x64 }
          - { name: macOS arm64, runner: macos-15, architecture: arm64 }
          - { name: Windows x86_64, runner: windows-2025, architecture: x64 }
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v7
      - name: Install native Miniforge
        uses: conda-incubator/setup-miniconda@v3
        with:
          miniforge-version: latest
          activate-environment: ""
          architecture: ${{ matrix.architecture }}
          auto-update-conda: false
      - name: Install Rust toolchain
        shell: bash
        run: |
          conda --version
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal
          rustup default "$RUST_TOOLCHAIN"
      - name: Restore shared Rust dependency cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: native-boundary
          add-job-id-key: "false"
          cache-bin: "false"
          cache-on-failure: "true"
      - name: Run deterministic Conda boundary
        run: cargo test --locked --test conda_adapter_boundary --test transaction_boundary --test restore_dispatch_boundary -- --test-threads=1
      - name: Build native release executable
        run: cargo build --locked --release --bin mirrorswitch
      - name: Exercise macOS subdir, frontends, query, and recovery
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -Eeuo pipefail
          binary="$PWD/target/release/mirrorswitch"
          boundary="$RUNNER_TEMP/mirrorswitch-conda-boundary"
          export HOME="$boundary/home" CONDARC="$boundary/home/.condarc"
          mkdir -p "$HOME" "$boundary/project"
          printf 'channels:\n  - defaults\n  - conda-forge\ndefault_channels:\n  - https://repo.anaconda.com/pkgs/main\n  - https://repo.anaconda.com/pkgs/r\ncustom_channels:\n  conda-forge: https://conda.anaconda.org\nchannel_priority: strict\nssl_verify: true\n' > "$CONDARC"
          chmod 0600 "$CONDARC"
          printf '{"version":1,"tools":[{"id":"conda","scope":"user"}]}\n' > "$boundary/project/request.json"
          before=$(shasum -a 256 "$CONDARC"|awk '{print $1}'); mode=$(stat -f '%Lp' "$CONDARC")
          cd "$boundary/project"
          "$binary" status --offline --json > status.json
          "$binary" plan --offline --tool conda --scope conda=user --json > plan-cli.json
          "$binary" plan --offline --config request.json --json > plan-config.json
          python3 - <<'PY'
          import json
          s=json.load(open('status.json')); assert [t['adapter_key'] for t in s['detected_tools'] if t['adapter_key']=='conda']==['conda']
          a=json.load(open('plan-cli.json')); b=json.load(open('plan-config.json')); assert a['ok'] and b['ok'] and a['plan']['tools'][0]['plan']==b['plan']['tools'][0]['plan']
          PY
          printf '\nn\n'|"$binary" tui --offline --tool conda --scope conda=user > tui.txt
          grep -E 'mirror=(nju|tuna|ustc)' tui.txt
          "$binary" apply --offline --config request.json --yes --json > apply.json
          transaction_id=$(python3 - <<'PY'
          import json
          r=json.load(open('apply.json'))['result']; assert r['successful']; a=[t for t in r['tools'] if t['status']=='applied']; assert len(a)==1; print(a[0]['receipt']['transaction_id'])
          PY
          )
          "$binary" apply --offline --config request.json --yes --json > idempotent.json
          python3 - <<'PY'
          import json
          r=json.load(open('idempotent.json'))['result']; assert r['successful'] and not [t for t in r['tools'] if t['status']=='applied']
          PY
          "$binary" restore "$transaction_id" --yes --json > restore.json
          python3 - <<'PY'
          import json
          r=json.load(open('restore.json')); assert r['adapter_key']=='conda' and r['receipt']['verified']
          PY
          test "$before" = "$(shasum -a 256 "$CONDARC"|awk '{print $1}')"
          test "$mode" = "$(stat -f '%Lp' "$CONDARC")"
      - name: Exercise Windows subdir, frontends, query, and recovery
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $binary=Join-Path $PWD 'target/release/mirrorswitch.exe'; $boundary=Join-Path $env:RUNNER_TEMP 'mirrorswitch-conda-boundary'
          $env:USERPROFILE=Join-Path $boundary 'home'; $env:HOME=$env:USERPROFILE; $env:CONDARC=Join-Path $env:USERPROFILE '.condarc'; $env:LOCALAPPDATA=Join-Path $boundary 'AppData/Local'
          New-Item -ItemType Directory -Force $env:USERPROFILE,$env:LOCALAPPDATA,(Join-Path $boundary 'project')|Out-Null
          $text="channels:`r`n  - defaults`r`n  - conda-forge`r`ndefault_channels:`r`n  - https://repo.anaconda.com/pkgs/main`r`n  - https://repo.anaconda.com/pkgs/r`r`ncustom_channels:`r`n  conda-forge: https://conda.anaconda.org`r`nchannel_priority: strict`r`nssl_verify: true`r`n"
          [IO.File]::WriteAllText($env:CONDARC,$text,[Text.UTF8Encoding]::new($true))
          $project=Join-Path $boundary 'project'; '{"version":1,"tools":[{"id":"conda","scope":"user"}]}'|Set-Content -Encoding utf8 (Join-Path $project 'request.json')
          $before=(Get-FileHash $env:CONDARC -Algorithm SHA256).Hash; $acl=(Get-Acl $env:CONDARC).Sddl
          Push-Location $project
          try {
            (& $binary status --offline --json)|Set-Content -Encoding utf8 status.json
            (& $binary plan --offline --tool conda --scope conda=user --json)|Set-Content -Encoding utf8 plan-cli.json
            (& $binary plan --offline --config request.json --json)|Set-Content -Encoding utf8 plan-config.json
            $s=Get-Content status.json -Raw|ConvertFrom-Json; if(@($s.detected_tools|Where-Object adapter_key -eq 'conda').Count -ne 1){throw 'Conda not detected'}
            $a=Get-Content plan-cli.json -Raw|ConvertFrom-Json; $b=Get-Content plan-config.json -Raw|ConvertFrom-Json
            if(-not $a.ok -or -not $b.ok -or -not [string]::Equals([string]($a.plan.tools[0].plan|ConvertTo-Json -Depth 100 -Compress), [string]($b.plan.tools[0].plan|ConvertTo-Json -Depth 100 -Compress))){throw 'frontend plans differ'}
            @('','n')|& $binary tui --offline --tool conda --scope conda=user|Set-Content -Encoding utf8 tui.txt
            if(-not((Get-Content tui.txt)-match 'mirror=(nju|tuna|ustc)')){throw 'Conda TUI mirror missing'}
            (& $binary apply --offline --config request.json --yes --json)|Set-Content -Encoding utf8 apply.json
            $r=Get-Content apply.json -Raw|ConvertFrom-Json; if(-not $r.result.successful){throw 'Conda apply failed'}
            $applied=@($r.result.tools|Where-Object status -eq 'applied'); if($applied.Count -ne 1){throw 'transaction missing'}; $id=$applied[0].receipt.transaction_id
            (& $binary apply --offline --config request.json --yes --json)|Set-Content -Encoding utf8 idempotent.json
            $again=Get-Content idempotent.json -Raw|ConvertFrom-Json; if(-not $again.result.successful -or @($again.result.tools|Where-Object status -eq 'applied').Count -ne 0){throw 'not idempotent'}
            (& $binary restore $id --yes --json)|Set-Content -Encoding utf8 restore.json
            $restore=Get-Content restore.json -Raw|ConvertFrom-Json; if(-not $restore.receipt.verified -or $restore.adapter_key -ne 'conda'){throw 'restore failed'}
          } finally {Pop-Location}
          if($before -ne (Get-FileHash $env:CONDARC -Algorithm SHA256).Hash -or $acl -ne (Get-Acl $env:CONDARC).Sddl){throw '.condarc not restored exactly'}
      - name: Save redacted boundary evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: conda-native-boundary-${{ runner.os }}-${{ matrix.architecture }}-${{ github.run_id }}
          path: ${{ runner.temp }}/mirrorswitch-conda-boundary/project/*.json
          if-no-files-found: warn
          retention-days: 7
