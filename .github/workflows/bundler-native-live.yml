name: Bundler macOS and Windows live boundary

on:
  schedule:
    - cron: "27 6 * * 3"
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_TOOLCHAIN: 1.88.0

jobs:
  native:
    name: Bundler (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: macOS x86_64, runner: macos-15-intel }
          - { name: macOS arm64, runner: macos-15 }
          - { name: Windows x86_64, runner: windows-2025 }
          - { name: Windows arm64, runner: windows-11-arm }
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4.10"
          bundler: "4.0.19"
      - name: Install Rust toolchain
        shell: bash
        run: |
          ruby --version && bundle --version
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal
          rustup default "$RUST_TOOLCHAIN"
      - name: Restore shared Rust dependency cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: native-boundary
          add-job-id-key: "false"
          cache-bin: "false"
          cache-on-failure: "true"
      - name: Run deterministic Bundler boundary
        run: cargo test --locked --test bundler_adapter_boundary --test transaction_boundary --test restore_dispatch_boundary -- --test-threads=1
      - name: Build native release executable
        run: cargo build --locked --release --bin mirrorswitch
      - name: Exercise macOS native configs, frontends, lock query, and recovery
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -Eeuo pipefail
          binary="$PWD/target/release/mirrorswitch"; boundary="$RUNNER_TEMP/mirrorswitch-bundler-boundary"; export HOME="$boundary/home"
          unset BUNDLE_USER_HOME BUNDLE_USER_CONFIG BUNDLE_APP_CONFIG BUNDLE_GEMFILE BUNDLE_IGNORE_CONFIG BUNDLE_MIRROR__ALL BUNDLE_SSL_VERIFY_MODE BUNDLE_DISABLE_CHECKSUM_VALIDATION BUNDLE_PATH BUNDLE_CACHE_PATH
          project="$HOME/project"; global="$HOME/.bundle/config"; local_config="$project/.bundle/config"; mkdir -p "$(dirname "$global")" "$(dirname "$local_config")"
          printf '%s\n' '---' 'BUNDLE_GEMS__CORP__EXAMPLE: "fixture:credential"' 'BUNDLE_MIRROR__HTTPS://GEMS__CORP__EXAMPLE/: "https://packages.invalid.example/cache/"' 'BUNDLE_SSL_CA_CERT: "/private/fixture/ca.pem"' 'BUNDLE_HTTPS_PROXY: "https://proxy.corp.example/"' 'BUNDLE_WITHOUT: "development"' > "$global"; chmod 0600 "$global"
          printf '%s\n' '---' 'BUNDLE_PATH: "vendor/bundle"' > "$local_config"; chmod 0600 "$local_config"
          printf '%s\n' 'source "https://rubygems.org"' 'gem "net-protocol", "= 0.3.0"' > "$project/Gemfile"; chmod 0400 "$project/Gemfile"
          printf '%s\n' 'GEM' '  remote: https://rubygems.org/' '  specs:' '    net-protocol (0.3.0)' '' 'DEPENDENCIES' '  net-protocol (= 0.3.0)' > "$project/Gemfile.lock"; chmod 0400 "$project/Gemfile.lock"
          printf '{"version":1,"tools":[{"id":"bundler","scope":"user"}]}\n' > "$project/request.json"
          before=$(shasum -a 256 "$global"|awk '{print $1}'); local_before=$(shasum -a 256 "$local_config"|awk '{print $1}'); gemfile_before=$(shasum -a 256 "$project/Gemfile"|awk '{print $1}'); lock_before=$(shasum -a 256 "$project/Gemfile.lock"|awk '{print $1}'); mode=$(stat -f '%Lp' "$global")
          cd "$project"
          "$binary" status --offline --json > status.json; "$binary" plan --offline --tool bundler --scope bundler=user --json > plan-cli.json; "$binary" plan --offline --config request.json --json > plan-config.json
          python3 - "$global" <<'PY'
          import json, sys
          status=json.load(open('status.json')); tools=[t for t in status['detected_tools'] if t['adapter_key']=='bundler']; assert len(tools)==1
          evidence='\n'.join(tools[0]['detected']['evidence']); assert sys.argv[1] in evidence and 'Macos' in evidence and 'project Gemfile and lockfile are read-only' in evidence
          a=json.load(open('plan-cli.json')); b=json.load(open('plan-config.json')); assert a['ok'] and b['ok'] and a['plan']['tools'][0]['plan']==b['plan']['tools'][0]['plan']
          assert 'fixture:credential' not in open('status.json').read()+open('plan-cli.json').read()+open('plan-config.json').read()
          PY
          printf '\nn\n'|"$binary" tui --offline --tool bundler --scope bundler=user > tui.txt; grep -E 'mirror=(aliyun|nju|tuna|ustc)' tui.txt; ! grep -F 'fixture:credential' tui.txt
          "$binary" apply --offline --config request.json --yes --json > apply.json
          id=$(python3 - <<'PY'
          import json
          r=json.load(open('apply.json'))['result']; assert r['successful']; a=[t for t in r['tools'] if t['status']=='applied']; assert len(a)==1; print(a[0]['receipt']['transaction_id'])
          PY
          )
          bundle config get mirror.https://rubygems.org/ > native-config.txt; grep -E 'https://mirrors\.(aliyun\.com|nju\.edu\.cn|tuna\.tsinghua\.edu\.cn|ustc\.edu\.cn)/rubygems/' native-config.txt
          "$binary" apply --offline --config request.json --yes --json > idempotent.json; "$binary" restore "$id" --yes --json > restore.json
          python3 - <<'PY'
          import json
          a=json.load(open('idempotent.json'))['result']; r=json.load(open('restore.json')); assert a['successful'] and not [t for t in a['tools'] if t['status']=='applied']; assert r['adapter_key']=='bundler' and r['receipt']['verified']
          PY
          test "$before" = "$(shasum -a 256 "$global"|awk '{print $1}')"; test "$local_before" = "$(shasum -a 256 "$local_config"|awk '{print $1}')"; test "$gemfile_before" = "$(shasum -a 256 Gemfile|awk '{print $1}')"; test "$lock_before" = "$(shasum -a 256 Gemfile.lock|awk '{print $1}')"; test "$mode" = "$(stat -f '%Lp' "$global")"; test ! -e "$HOME/.mirrorswitch/verification/bundler/.bundle/config"; test ! -e "$HOME/.mirrorswitch/verification/bundler/Gemfile"
      - name: Exercise Windows bundle launcher, configs, frontends, lock query, and recovery
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'; $binary=Join-Path $PWD 'target/release/mirrorswitch.exe'; $boundary=Join-Path $env:RUNNER_TEMP 'mirrorswitch-bundler-boundary'
          $env:USERPROFILE=Join-Path $boundary 'home'; $env:HOME=$env:USERPROFILE; $env:APPDATA=Join-Path $boundary 'AppData/Roaming'; $env:LOCALAPPDATA=Join-Path $boundary 'AppData/Local'; Remove-Item Env:BUNDLE_USER_HOME,Env:BUNDLE_USER_CONFIG,Env:BUNDLE_APP_CONFIG,Env:BUNDLE_GEMFILE,Env:BUNDLE_IGNORE_CONFIG,Env:BUNDLE_MIRROR__ALL,Env:BUNDLE_SSL_VERIFY_MODE,Env:BUNDLE_DISABLE_CHECKSUM_VALIDATION,Env:BUNDLE_PATH,Env:BUNDLE_CACHE_PATH -ErrorAction SilentlyContinue
          $launcher=(Get-Command bundle -CommandType Application|Select-Object -First 1).Source; if([IO.Path]::GetExtension($launcher) -notin @('.bat','.cmd')){throw "native Bundler launcher is not a batch command: $launcher"}
          $project=Join-Path $env:USERPROFILE 'project'; $global=Join-Path $env:USERPROFILE '.bundle/config'; $localConfig=Join-Path $project '.bundle/config'; New-Item -ItemType Directory -Force (Split-Path $global),(Split-Path $localConfig),$env:APPDATA,$env:LOCALAPPDATA|Out-Null
          $config="---`r`nBUNDLE_GEMS__CORP__EXAMPLE: `"fixture:credential`"`r`nBUNDLE_MIRROR__HTTPS://GEMS__CORP__EXAMPLE/: `"https://packages.invalid.example/cache/`"`r`nBUNDLE_SSL_CA_CERT: 'C:/fixture/ca.pem'`r`nBUNDLE_HTTPS_PROXY: `"https://proxy.corp.example/`"`r`nBUNDLE_WITHOUT: `"development`"`r`n"; [IO.File]::WriteAllText($global,$config,[Text.UTF8Encoding]::new($true)); [IO.File]::WriteAllText($localConfig,"---`r`nBUNDLE_PATH: `"vendor/bundle`"`r`n",[Text.UTF8Encoding]::new($false)); [IO.File]::WriteAllText((Join-Path $project 'Gemfile'),"source `"https://rubygems.org`"`r`ngem `"net-protocol`", `"= 0.3.0`"`r`n",[Text.UTF8Encoding]::new($false)); [IO.File]::WriteAllText((Join-Path $project 'Gemfile.lock'),"GEM`r`n  remote: https://rubygems.org/`r`n  specs:`r`n    net-protocol (0.3.0)`r`n`r`nDEPENDENCIES`r`n  net-protocol (= 0.3.0)`r`n",[Text.UTF8Encoding]::new($false)); Set-ItemProperty (Join-Path $project 'Gemfile') IsReadOnly $true; Set-ItemProperty (Join-Path $project 'Gemfile.lock') IsReadOnly $true; [IO.File]::WriteAllText((Join-Path $project 'request.json'),'{"version":1,"tools":[{"id":"bundler","scope":"user"}]}',[Text.UTF8Encoding]::new($false))
          $before=(Get-FileHash $global -Algorithm SHA256).Hash; $localBefore=(Get-FileHash $localConfig -Algorithm SHA256).Hash; $gemfileBefore=(Get-FileHash (Join-Path $project 'Gemfile') -Algorithm SHA256).Hash; $lockBefore=(Get-FileHash (Join-Path $project 'Gemfile.lock') -Algorithm SHA256).Hash
          Push-Location $project
          try{
            (& $binary status --offline --json)|Set-Content -Encoding utf8 status.json; (& $binary plan --offline --tool bundler --scope bundler=user --json)|Set-Content -Encoding utf8 plan-cli.json; (& $binary plan --offline --config request.json --json)|Set-Content -Encoding utf8 plan-config.json
            $s=Get-Content status.json -Raw|ConvertFrom-Json; $tools=@($s.detected_tools|Where-Object adapter_key -eq 'bundler'); if($tools.Count -ne 1){throw 'Bundler not detected'}; $evidence=$tools[0].detected.evidence -join "`n"; if(-not $evidence.Contains($global) -or -not $evidence.Contains('Windows') -or -not $evidence.Contains('project Gemfile and lockfile are read-only')){throw 'native path/platform evidence missing'}
            $a=Get-Content plan-cli.json -Raw|ConvertFrom-Json; $b=Get-Content plan-config.json -Raw|ConvertFrom-Json; if(-not $a.ok -or -not $b.ok -or -not [string]::Equals([string]($a.plan.tools[0].plan|ConvertTo-Json -Depth 100 -Compress), [string]($b.plan.tools[0].plan|ConvertTo-Json -Depth 100 -Compress))){throw 'frontend plans differ'}; if((Get-Content status.json,plan-cli.json,plan-config.json -Raw)-match 'fixture:credential'){throw 'credential leaked in preview'}
            @('','n')|& $binary tui --offline --tool bundler --scope bundler=user|Set-Content -Encoding utf8 tui.txt; if(-not((Get-Content tui.txt)-match 'mirror=(aliyun|nju|tuna|ustc)') -or (Get-Content tui.txt -Raw).Contains('fixture:credential')){throw 'TUI output invalid'}
            (& $binary apply --offline --config request.json --yes --json)|Set-Content -Encoding utf8 apply.json; $r=Get-Content apply.json -Raw|ConvertFrom-Json; if(-not $r.result.successful){throw 'Bundler apply failed'}; $applied=@($r.result.tools|Where-Object status -eq 'applied'); if($applied.Count -ne 1){throw 'transaction missing'}; $id=$applied[0].receipt.transaction_id
            (& bundle config get mirror.https://rubygems.org/)|Set-Content -Encoding utf8 native-config.txt; if(-not((Get-Content native-config.txt)-match 'https://mirrors\.(aliyun\.com|nju\.edu\.cn|tuna\.tsinghua\.edu\.cn|ustc\.edu\.cn)/rubygems/')){throw 'native Bundler did not load the selected user mirror'}
            (& $binary apply --offline --config request.json --yes --json)|Set-Content -Encoding utf8 idempotent.json; $again=Get-Content idempotent.json -Raw|ConvertFrom-Json; if(-not $again.result.successful -or @($again.result.tools|Where-Object status -eq 'applied').Count -ne 0){throw 'not idempotent'}; (& $binary restore $id --yes --json)|Set-Content -Encoding utf8 restore.json; $restore=Get-Content restore.json -Raw|ConvertFrom-Json; if(-not $restore.receipt.verified -or $restore.adapter_key -ne 'bundler'){throw 'restore failed'}
          }finally{Pop-Location}
          $verification=Join-Path $env:USERPROFILE '.mirrorswitch/verification/bundler'; if($before -ne (Get-FileHash $global -Algorithm SHA256).Hash -or $localBefore -ne (Get-FileHash $localConfig -Algorithm SHA256).Hash -or $gemfileBefore -ne (Get-FileHash (Join-Path $project 'Gemfile') -Algorithm SHA256).Hash -or $lockBefore -ne (Get-FileHash (Join-Path $project 'Gemfile.lock') -Algorithm SHA256).Hash -or (Test-Path (Join-Path $verification '.bundle/config')) -or (Test-Path (Join-Path $verification 'Gemfile'))){throw 'Bundler state not restored exactly'}
      - name: Save redacted boundary evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: bundler-native-${{ matrix.name }}-${{ github.run_id }}
          path: ${{ runner.temp }}/mirrorswitch-bundler-boundary/home/project/*.json
          if-no-files-found: warn
          retention-days: 7
