name: CocoaPods macOS live boundary

on:
  schedule:
    - cron: "53 21 * * 2"
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_TOOLCHAIN: 1.88.0

jobs:
  native:
    name: CocoaPods (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: macos-15-intel
          - arch: arm64
            runner: macos-15
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7
      - name: Install Rust toolchain
        run: rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal && rustup default "$RUST_TOOLCHAIN"
      - name: Ensure CocoaPods is installed
        run: command -v pod >/dev/null || sudo gem install cocoapods --no-document
      - name: Create a controlled public Specs checkout
        shell: bash
        run: |
          set -Eeuo pipefail
          repo="$HOME/.cocoapods/repos/master"
          mkdir -p "$repo/Specs/a/7/5/AFNetworking/4.0.1"
          git -C "$repo" init --initial-branch=master
          git -C "$repo" config user.name MirrorSwitch
          git -C "$repo" config user.email ci@mirrorswitch.invalid
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          repo = Path(os.environ["HOME"]) / ".cocoapods/repos/master"
          spec = {
              "name": "AFNetworking",
              "version": "4.0.1",
              "summary": "CI boundary fixture",
              "homepage": "https://github.com/AFNetworking/AFNetworking",
              "license": "MIT",
              "authors": {"Fixture": "ci@mirrorswitch.invalid"},
              "source": {
                  "git": "https://github.com/AFNetworking/AFNetworking.git",
                  "tag": "4.0.1",
              },
              "source_files": "AFNetworking/*.{h,m}",
              "platforms": {"ios": "9.0"},
          }
          path = repo / "Specs/a/7/5/AFNetworking/4.0.1/AFNetworking.podspec.json"
          path.write_text(json.dumps(spec) + "\n", encoding="utf-8")
          (repo / "CocoaPods-version.yml").write_text("---\nmin: 1.0.0\nlast: 1.16.2\n", encoding="utf-8")
          PY
          git -C "$repo" add .
          git -C "$repo" commit -m fixture
          git -C "$repo" remote add origin https://github.com/CocoaPods/Specs.git
          pod repo list --no-ansi
      - name: Restore shared Rust dependency cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: native-boundary-v4-${{ hashFiles('Cargo.toml', 'Cargo.lock', 'src/**/*.rs', 'tests/**/*.rs') }}
          add-job-id-key: "false"
          cache-workspace-crates: "true"
          cache-bin: "false"
          cache-on-failure: "false"
      - name: Run deterministic CocoaPods adapter boundary
        run: cargo test --locked --test cocoapods_adapter_boundary -- --test-threads=1
      - name: Build native release executable
        run: cargo build --locked --release --bin mirrorswitch
      - name: Apply, verify, and restore a real CocoaPods plan
        shell: bash
        run: |
          set -Eeuo pipefail
          binary="$PWD/target/release/mirrorswitch"
          config="$HOME/.cocoapods/repos/master/.git/config"
          config_before=$(shasum -a 256 "$config" | awk '{print $1}')
          printf '{"version":1,"tools":[{"id":"cocoapods","scope":"user","mirrors":{"cocoapods--git-mirror":"6bf8c435edff7ed506917aa5"}}]}\n' > request.json

          "$binary" status --offline --json > status.json
          python3 - <<'PY'
          import json
          status = json.load(open("status.json"))
          assert [item["adapter_key"] for item in status["detected_tools"] if item["adapter_key"] == "cocoapods"] == ["cocoapods"]
          PY
          "$binary" plan --offline --tool cocoapods --scope cocoapods=user --mirror cocoapods:cocoapods--git-mirror=6bf8c435edff7ed506917aa5 --json > plan-cli.json
          "$binary" plan --offline --config request.json --json > plan-config.json
          python3 - <<'PY'
          import json
          cli = json.load(open("plan-cli.json")); config = json.load(open("plan-config.json"))
          assert cli["ok"] is True and config["ok"] is True
          assert cli["plan"]["tools"][0]["plan"] == config["plan"]["tools"][0]["plan"]
          tools = cli["plan"]["tools"]
          assert [item["adapter_key"] for item in tools] == ["cocoapods"]
          assert [(item["provider_id"], item["candidate_id"]) for item in tools[0]["selection"]["selections"]] == [("nju", "6bf8c435edff7ed506917aa5")]
          assert tools[0]["plan"]["changes"][0]["target"].endswith("/.cocoapods/repos/master/.git/config")
          PY

          "$binary" apply --offline --config request.json --yes --json > apply.json
          transaction_id=$(python3 - <<'PY'
          import json
          result = json.load(open("apply.json"))["result"]
          assert result["successful"] is True
          applied = [item for item in result["tools"] if item["status"] == "applied"]
          assert len(applied) == 1 and applied[0]["verification"]["valid"] is True
          print(applied[0]["receipt"]["transaction_id"])
          PY
          )
          printf '\nn\n' | "$binary" tui --offline --tool cocoapods --scope cocoapods=user --mirror cocoapods:cocoapods--git-mirror=6bf8c435edff7ed506917aa5 > tui.txt
          grep -F 'mirror=nju' tui.txt
          "$binary" apply --offline --config request.json --yes --json > idempotent.json
          python3 - <<'PY'
          import json
          result=json.load(open('idempotent.json'))['result']; assert result['successful'] and not [item for item in result['tools'] if item['status']=='applied']
          PY
          "$binary" restore "$transaction_id" --yes --json > restore.json
          python3 - <<'PY'
          import json
          restore=json.load(open("restore.json")); assert restore["adapter_key"] == "cocoapods" and restore["receipt"]["verified"] is True
          PY

          test "$config_before" = "$(shasum -a 256 "$config" | awk '{print $1}')"
      - name: Save redacted boundary evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: cocoapods-boundary-${{ matrix.arch }}-${{ github.run_id }}
          path: |
            plan-cli.json
            plan-config.json
            apply.json
            idempotent.json
            request.json
            status.json
            restore.json
            tui.txt
          if-no-files-found: warn
          retention-days: 7
