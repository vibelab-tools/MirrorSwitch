name: Julia Pkg macOS and Windows live boundary

on:
  schedule:
    - cron: "15 7 * * 3"
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_TOOLCHAIN: 1.88.0

jobs:
  native:
    name: Julia Pkg (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: macOS x86_64, runner: macos-15-intel, julia_arch: x64 }
          - { name: macOS arm64, runner: macos-15, julia_arch: aarch64 }
          - { name: Windows x86_64, runner: windows-2025, julia_arch: x64 }
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v7
      - uses: julia-actions/setup-julia@v3
        with:
          version: "1.11.7"
          arch: ${{ matrix.julia_arch }}
      - name: Install Rust toolchain
        shell: bash
        run: |
          julia --version
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal
          rustup default "$RUST_TOOLCHAIN"
      - name: Restore shared Rust dependency cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: native-boundary
          add-job-id-key: "false"
          cache-bin: "false"
          cache-on-failure: "true"
      - name: Run deterministic Julia boundary
        run: cargo test --locked --test julia_adapter_boundary --test transaction_boundary --test restore_dispatch_boundary -- --test-threads=1
      - name: Build native release executable
        run: cargo build --locked --release --bin mirrorswitch
      - name: Exercise macOS profile, depot/project priority, query, and recovery
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -Eeuo pipefail
          binary="$PWD/target/release/mirrorswitch"; boundary="$RUNNER_TEMP/mirrorswitch-julia-boundary"; export HOME="$boundary/home" SHELL=/bin/zsh
          unset PROFILE ZDOTDIR JULIA_PKG_SERVER JULIA_DEPOT_PATH JULIA_PROJECT JULIA_LOAD_PATH
          project="$HOME/project"; profile="$HOME/.zshrc"; auth="$HOME/.julia/servers/pkg.julialang.org/auth.toml"; mkdir -p "$project" "$(dirname "$auth")"
          printf '%s\n' '# native shell policy' "export JULIA_PKG_SERVER='https://pkg.julialang.org'" > "$profile"; chmod 0600 "$profile"
          printf '%s\n' 'token = "fixture-only"' > "$auth"; chmod 0600 "$auth"
          printf '%s\n' '[deps]' > "$project/Project.toml"; chmod 0400 "$project/Project.toml"
          printf '%s\n' '# preserved manifest' > "$project/Manifest.toml"; chmod 0400 "$project/Manifest.toml"
          printf '{"version":1,"tools":[{"id":"julia","scope":"user"}]}\n' > "$project/request.json"
          before=$(shasum -a 256 "$profile"|awk '{print $1}'); auth_before=$(shasum -a 256 "$auth"|awk '{print $1}'); project_before=$(shasum -a 256 "$project/Project.toml"|awk '{print $1}'); manifest_before=$(shasum -a 256 "$project/Manifest.toml"|awk '{print $1}'); mode=$(stat -f '%Lp' "$profile")
          cd "$project"
          "$binary" status --offline --json > status.json; "$binary" plan --offline --tool julia --scope julia=user --json > plan-cli.json; "$binary" plan --offline --config request.json --json > plan-config.json
          python3 - "$profile" <<'PY'
          import json, sys
          status=json.load(open('status.json')); tools=[t for t in status['detected_tools'] if t['adapter_key']=='julia']; assert len(tools)==1
          evidence='\n'.join(tools[0]['detected']['evidence']); assert sys.argv[1] in evidence and 'Macos' in evidence and 'active project is detected' in evidence
          a=json.load(open('plan-cli.json')); b=json.load(open('plan-config.json')); assert a['ok'] and b['ok'] and a['plan']['tools'][0]['plan']==b['plan']['tools'][0]['plan']
          PY
          printf '\nn\n'|"$binary" tui --offline --tool julia --scope julia=user > tui.txt; grep -F 'mirror=nju' tui.txt; ! grep -F 'fixture-only' tui.txt
          "$binary" apply --offline --config request.json --yes --json > apply.json
          id=$(python3 - <<'PY'
          import json
          r=json.load(open('apply.json'))['result']; assert r['successful']; a=[t for t in r['tools'] if t['status']=='applied']; assert len(a)==1; print(a[0]['receipt']['transaction_id'])
          PY
          )
          grep -F "JULIA_PKG_SERVER='https://mirrors.nju.edu.cn/julia'" "$profile"
          "$binary" apply --offline --config request.json --yes --json > idempotent.json; "$binary" restore "$id" --yes --json > restore.json
          python3 - <<'PY'
          import json
          a=json.load(open('idempotent.json'))['result']; r=json.load(open('restore.json')); assert a['successful'] and not [t for t in a['tools'] if t['status']=='applied']; assert r['adapter_key']=='julia' and r['receipt']['verified']
          PY
          test "$before" = "$(shasum -a 256 "$profile"|awk '{print $1}')"; test "$auth_before" = "$(shasum -a 256 "$auth"|awk '{print $1}')"; test "$project_before" = "$(shasum -a 256 Project.toml|awk '{print $1}')"; test "$manifest_before" = "$(shasum -a 256 Manifest.toml|awk '{print $1}')"; test "$mode" = "$(stat -f '%Lp' "$profile")"
      - name: Exercise Windows launcher, registry, depot/project priority, and recovery
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'; $binary=Join-Path $PWD 'target/release/mirrorswitch.exe'; $boundary=Join-Path $env:RUNNER_TEMP 'mirrorswitch-julia-boundary'
          $env:USERPROFILE=Join-Path $boundary 'home'; $env:HOME=$env:USERPROFILE; $env:LOCALAPPDATA=Join-Path $boundary 'AppData/Local'; Remove-Item Env:JULIA_PKG_SERVER,Env:JULIA_DEPOT_PATH,Env:JULIA_PROJECT,Env:JULIA_LOAD_PATH -ErrorAction SilentlyContinue
          $launcher=(Get-Command julia -CommandType Application|Select-Object -First 1).Source; if([IO.Path]::GetExtension($launcher) -ne '.exe'){throw "native Julia launcher is not an executable: $launcher"}
          $project=Join-Path $env:USERPROFILE 'project'; $auth=Join-Path $env:USERPROFILE '.julia/servers/pkg.julialang.org/auth.toml'; New-Item -ItemType Directory -Force $env:USERPROFILE,$env:LOCALAPPDATA,$project,(Split-Path $auth)|Out-Null
          & reg.exe add 'HKCU\Environment' /v JULIA_PKG_SERVER /t REG_SZ /d 'https://pkg.julialang.org' /f|Out-Null
          [IO.File]::WriteAllText($auth,'token = "fixture-only"',[Text.UTF8Encoding]::new($false)); [IO.File]::WriteAllText((Join-Path $project 'Project.toml'),'[deps]',[Text.UTF8Encoding]::new($false)); [IO.File]::WriteAllText((Join-Path $project 'Manifest.toml'),'# preserved manifest',[Text.UTF8Encoding]::new($false)); Set-ItemProperty (Join-Path $project 'Project.toml') IsReadOnly $true; Set-ItemProperty (Join-Path $project 'Manifest.toml') IsReadOnly $true; [IO.File]::WriteAllText((Join-Path $project 'request.json'),'{"version":1,"tools":[{"id":"julia","scope":"user"}]}',[Text.UTF8Encoding]::new($false))
          $authBefore=(Get-FileHash $auth -Algorithm SHA256).Hash; $projectBefore=(Get-FileHash (Join-Path $project 'Project.toml') -Algorithm SHA256).Hash; $manifestBefore=(Get-FileHash (Join-Path $project 'Manifest.toml') -Algorithm SHA256).Hash
          Push-Location $project
          try{
            (& $binary status --offline --json)|Set-Content -Encoding utf8 status.json; (& $binary plan --offline --tool julia --scope julia=user --json)|Set-Content -Encoding utf8 plan-cli.json; (& $binary plan --offline --config request.json --json)|Set-Content -Encoding utf8 plan-config.json
            $s=Get-Content status.json -Raw|ConvertFrom-Json; $tools=@($s.detected_tools|Where-Object adapter_key -eq 'julia'); if($tools.Count -ne 1){throw 'Julia not detected'}; $evidence=$tools[0].detected.evidence -join "`n"; if(-not $evidence.Contains('Windows') -or -not $evidence.Contains('Windows user environment') -or -not $evidence.Contains('active project is detected')){throw 'native persistence/platform evidence missing'}
            $a=Get-Content plan-cli.json -Raw|ConvertFrom-Json; $b=Get-Content plan-config.json -Raw|ConvertFrom-Json; if(-not $a.ok -or -not $b.ok -or -not [string]::Equals([string]($a.plan.tools[0].plan|ConvertTo-Json -Depth 100 -Compress), [string]($b.plan.tools[0].plan|ConvertTo-Json -Depth 100 -Compress))){throw 'frontend plans differ'}
            @('','n')|& $binary tui --offline --tool julia --scope julia=user|Set-Content -Encoding utf8 tui.txt; if(-not((Get-Content tui.txt)-match 'mirror=nju') -or (Get-Content tui.txt -Raw).Contains('fixture-only')){throw 'TUI output invalid'}
            (& $binary apply --offline --config request.json --yes --json)|Set-Content -Encoding utf8 apply.json; $r=Get-Content apply.json -Raw|ConvertFrom-Json; if(-not $r.result.successful){throw 'Julia apply failed'}; $applied=@($r.result.tools|Where-Object status -eq 'applied'); if($applied.Count -ne 1){throw 'transaction missing'}; $id=$applied[0].receipt.transaction_id
            $value=(Get-ItemProperty 'HKCU:\Environment' JULIA_PKG_SERVER).JULIA_PKG_SERVER; if($value -ne 'https://mirrors.nju.edu.cn/julia'){throw "registry mirror mismatch: $value"}
            (& $binary apply --offline --config request.json --yes --json)|Set-Content -Encoding utf8 idempotent.json; $again=Get-Content idempotent.json -Raw|ConvertFrom-Json; if(-not $again.result.successful -or @($again.result.tools|Where-Object status -eq 'applied').Count -ne 0){throw 'not idempotent'}; (& $binary restore $id --yes --json)|Set-Content -Encoding utf8 restore.json; $restore=Get-Content restore.json -Raw|ConvertFrom-Json; if(-not $restore.receipt.verified -or $restore.adapter_key -ne 'julia'){throw 'restore failed'}
          }finally{Pop-Location}
          $restored=(Get-ItemProperty 'HKCU:\Environment' JULIA_PKG_SERVER).JULIA_PKG_SERVER; $recovery=Join-Path $env:LOCALAPPDATA 'MirrorSwitch/julia/environment-recovery.json'; if($restored -ne 'https://pkg.julialang.org' -or $authBefore -ne (Get-FileHash $auth -Algorithm SHA256).Hash -or $projectBefore -ne (Get-FileHash (Join-Path $project 'Project.toml') -Algorithm SHA256).Hash -or $manifestBefore -ne (Get-FileHash (Join-Path $project 'Manifest.toml') -Algorithm SHA256).Hash -or (Test-Path $recovery)){throw 'Julia state not restored exactly'}
      - name: Save redacted boundary evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: julia-native-${{ matrix.name }}-${{ github.run_id }}
          path: ${{ runner.temp }}/mirrorswitch-julia-boundary/home/project/*.json
          if-no-files-found: warn
          retention-days: 7
