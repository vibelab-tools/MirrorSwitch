name: CRAN macOS and Windows live boundary

on:
  schedule:
    - cron: "27 7 * * 3"
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_TOOLCHAIN: 1.88.0

jobs:
  native:
    name: CRAN (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: macOS x86_64, runner: macos-15-intel }
          - { name: macOS arm64, runner: macos-15 }
          - { name: Windows x86_64, runner: windows-2025 }
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: "4.6.0"
          use-public-rspm: false
      - name: Install Rust toolchain
        shell: bash
        run: |
          Rscript --version
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal
          rustup default "$RUST_TOOLCHAIN"
      - name: Restore shared Rust dependency cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: native-boundary-v2
          add-job-id-key: "false"
          cache-workspace-crates: "true"
          cache-bin: "false"
          cache-on-failure: "true"
      - name: Run deterministic CRAN boundary
        run: cargo test --locked --test cran_adapter_boundary --test transaction_boundary --test restore_dispatch_boundary -- --test-threads=1
      - name: Build native release executable
        run: cargo build --locked --release --bin mirrorswitch
      - name: Exercise macOS profile, binary package, frontends, and recovery
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -Eeuo pipefail
          binary="$PWD/target/release/mirrorswitch"; boundary="$RUNNER_TEMP/mirrorswitch-cran-boundary"; export HOME="$boundary/home"
          unset R_PROFILE R_PROFILE_USER R_ENVIRON_USER R_REPOSITORIES R_ARCH R_LIBS_USER RSTUDIO_CONFIG_HOME XDG_CONFIG_HOME
          project="$HOME/project"; profile="$HOME/.Rprofile"; environ="$HOME/.Renviron"; prefs="$HOME/.config/rstudio/rstudio-prefs.json"; mkdir -p "$project" "$(dirname "$prefs")"
          printf '%s\n' '# native R policy' 'options(repos = c(CRAN = "https://cloud.r-project.org", Private = "https://packages.invalid.example/r"))' > "$profile"; chmod 0600 "$profile"
          printf '%s\n' 'PRIVATE_TOKEN=fixture-only' > "$environ"; chmod 0600 "$environ"
          printf '%s\n' '{"cran_mirror":{"url":"https://cran.rstudio.com/"},"save_workspace":"never"}' > "$prefs"; chmod 0600 "$prefs"
          printf '%s\n' '{"R":{"Version":"4.6.0"},"Repositories":[]}' > "$project/renv.lock"; chmod 0400 "$project/renv.lock"
          printf '{"version":1,"tools":[{"id":"cran","scope":"user"}]}\n' > "$project/request.json"
          before=$(shasum -a 256 "$profile"|awk '{print $1}'); environ_before=$(shasum -a 256 "$environ"|awk '{print $1}'); prefs_before=$(shasum -a 256 "$prefs"|awk '{print $1}'); project_before=$(shasum -a 256 "$project/renv.lock"|awk '{print $1}'); mode=$(stat -f '%Lp' "$profile")
          cd "$project"
          "$binary" status --offline --json > status.json; "$binary" plan --offline --tool cran --scope cran=user --json > plan-cli.json; "$binary" plan --offline --config request.json --json > plan-config.json
          python3 - "$profile" <<'PY'
          import json, sys
          status=json.load(open('status.json')); tools=[t for t in status['detected_tools'] if t['adapter_key']=='cran']; assert len(tools)==1
          evidence='\n'.join(tools[0]['detected']['evidence']); assert sys.argv[1] in evidence and 'Macos' in evidence and 'R platform is' in evidence
          a=json.load(open('plan-cli.json')); b=json.load(open('plan-config.json')); assert a['ok'] and b['ok'] and a['plan']['tools'][0]['plan']==b['plan']['tools'][0]['plan']; assert 'fixture-only' not in open('status.json').read()+open('plan-cli.json').read()+open('plan-config.json').read()
          PY
          printf '\nn\n'|"$binary" tui --offline --tool cran --scope cran=user > tui.txt; grep -E 'mirror=(aliyun|nju|tuna|ustc)' tui.txt; ! grep -F 'fixture-only' tui.txt
          "$binary" apply --offline --config request.json --yes --json > apply.json
          id=$(python3 - <<'PY'
          import json
          r=json.load(open('apply.json'))['result']; assert r['successful']; a=[t for t in r['tools'] if t['status']=='applied']; assert len(a)==1; print(a[0]['receipt']['transaction_id'])
          PY
          )
          Rscript -e 'stopifnot(grepl("^https://mirrors\\.(aliyun\\.com|nju\\.edu\\.cn|tuna\\.tsinghua\\.edu\\.cn|ustc\\.edu\\.cn)/CRAN/?$", getOption("repos")[["CRAN"]]))'
          "$binary" apply --offline --config request.json --yes --json > idempotent.json; "$binary" restore "$id" --yes --json > restore.json
          python3 - <<'PY'
          import json
          a=json.load(open('idempotent.json'))['result']; r=json.load(open('restore.json')); assert a['successful'] and not [t for t in a['tools'] if t['status']=='applied']; assert r['adapter_key']=='cran' and r['receipt']['verified']
          PY
          test "$before" = "$(shasum -a 256 "$profile"|awk '{print $1}')"; test "$environ_before" = "$(shasum -a 256 "$environ"|awk '{print $1}')"; test "$prefs_before" = "$(shasum -a 256 "$prefs"|awk '{print $1}')"; test "$project_before" = "$(shasum -a 256 renv.lock|awk '{print $1}')"; test "$mode" = "$(stat -f '%Lp' "$profile")"; test ! -e "$HOME/.mirrorswitch/verification/cran/verify.R"
      - name: Exercise Windows profile, binary package, frontends, and recovery
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'; $binary=Join-Path $PWD 'target/release/mirrorswitch.exe'; $boundary=Join-Path $env:RUNNER_TEMP 'mirrorswitch-cran-boundary'
          $env:USERPROFILE=Join-Path $boundary 'home'; $env:HOME=$env:USERPROFILE; $env:APPDATA=Join-Path $env:USERPROFILE 'AppData/Roaming'; $env:LOCALAPPDATA=Join-Path $env:USERPROFILE 'AppData/Local'; Remove-Item Env:R_PROFILE,Env:R_PROFILE_USER,Env:R_ENVIRON_USER,Env:R_REPOSITORIES,Env:R_ARCH,Env:R_LIBS_USER,Env:RSTUDIO_CONFIG_HOME,Env:XDG_CONFIG_HOME -ErrorAction SilentlyContinue
          $launcher=(Get-Command Rscript -CommandType Application|Select-Object -First 1).Source; if([IO.Path]::GetExtension($launcher) -ne '.exe'){throw "native Rscript launcher is not an executable: $launcher"}
          $project=Join-Path $env:USERPROFILE 'project'; $profile=Join-Path $env:USERPROFILE '.Rprofile'; $environ=Join-Path $env:USERPROFILE '.Renviron'; $prefs=Join-Path $env:APPDATA 'RStudio/rstudio-prefs.json'; New-Item -ItemType Directory -Force $env:USERPROFILE,$env:APPDATA,$env:LOCALAPPDATA,$project,(Split-Path $prefs)|Out-Null
          [IO.File]::WriteAllText($profile,"# native R policy`r`noptions(repos = c(CRAN = `"https://cloud.r-project.org`", Private = `"https://packages.invalid.example/r`"))`r`n",[Text.UTF8Encoding]::new($true)); [IO.File]::WriteAllText($environ,'PRIVATE_TOKEN=fixture-only',[Text.UTF8Encoding]::new($false)); [IO.File]::WriteAllText($prefs,'{"cran_mirror":{"url":"https://cran.rstudio.com/"},"save_workspace":"never"}',[Text.UTF8Encoding]::new($false)); [IO.File]::WriteAllText((Join-Path $project 'renv.lock'),'{"R":{"Version":"4.6.0"},"Repositories":[]}',[Text.UTF8Encoding]::new($false)); Set-ItemProperty (Join-Path $project 'renv.lock') IsReadOnly $true; [IO.File]::WriteAllText((Join-Path $project 'request.json'),'{"version":1,"tools":[{"id":"cran","scope":"user"}]}',[Text.UTF8Encoding]::new($false))
          $before=(Get-FileHash $profile -Algorithm SHA256).Hash; $environBefore=(Get-FileHash $environ -Algorithm SHA256).Hash; $prefsBefore=(Get-FileHash $prefs -Algorithm SHA256).Hash; $projectBefore=(Get-FileHash (Join-Path $project 'renv.lock') -Algorithm SHA256).Hash
          Push-Location $project
          try{
            (& $binary status --offline --json)|Set-Content -Encoding utf8 status.json; (& $binary plan --offline --tool cran --scope cran=user --json)|Set-Content -Encoding utf8 plan-cli.json; (& $binary plan --offline --config request.json --json)|Set-Content -Encoding utf8 plan-config.json
            $s=Get-Content status.json -Raw|ConvertFrom-Json; $tools=@($s.detected_tools|Where-Object adapter_key -eq 'cran'); if($tools.Count -ne 1){throw 'CRAN not detected'}; $evidence=$tools[0].detected.evidence -join "`n"; if(-not $evidence.Contains($profile) -or -not $evidence.Contains('Windows') -or -not $evidence.Contains('R platform is')){throw 'native path/platform evidence missing'}
            $a=Get-Content plan-cli.json -Raw|ConvertFrom-Json; $b=Get-Content plan-config.json -Raw|ConvertFrom-Json; if(-not $a.ok -or -not $b.ok -or -not [string]::Equals([string]($a.plan.tools[0].plan|ConvertTo-Json -Depth 100 -Compress), [string]($b.plan.tools[0].plan|ConvertTo-Json -Depth 100 -Compress)) -or (Get-Content status.json,plan-cli.json,plan-config.json -Raw)-match 'fixture-only'){throw 'frontend plans differ or credential leaked'}
            @('','n')|& $binary tui --offline --tool cran --scope cran=user|Set-Content -Encoding utf8 tui.txt; if(-not((Get-Content tui.txt)-match 'mirror=(aliyun|nju|tuna|ustc)') -or (Get-Content tui.txt -Raw).Contains('fixture-only')){throw 'TUI output invalid'}
            (& $binary apply --offline --config request.json --yes --json)|Set-Content -Encoding utf8 apply.json; $r=Get-Content apply.json -Raw|ConvertFrom-Json; if(-not $r.result.successful){throw 'CRAN apply failed'}; $applied=@($r.result.tools|Where-Object status -eq 'applied'); if($applied.Count -ne 1){throw 'transaction missing'}; $id=$applied[0].receipt.transaction_id
            Rscript -e 'stopifnot(grepl("^https://mirrors\\.(aliyun\\.com|nju\\.edu\\.cn|tuna\\.tsinghua\\.edu\\.cn|ustc\\.edu\\.cn)/CRAN/?$", getOption("repos")[["CRAN"]]))'
            (& $binary apply --offline --config request.json --yes --json)|Set-Content -Encoding utf8 idempotent.json; $again=Get-Content idempotent.json -Raw|ConvertFrom-Json; if(-not $again.result.successful -or @($again.result.tools|Where-Object status -eq 'applied').Count -ne 0){throw 'not idempotent'}; (& $binary restore $id --yes --json)|Set-Content -Encoding utf8 restore.json; $restore=Get-Content restore.json -Raw|ConvertFrom-Json; if(-not $restore.receipt.verified -or $restore.adapter_key -ne 'cran'){throw 'restore failed'}
          }finally{Pop-Location}
          $script=Join-Path $env:USERPROFILE '.mirrorswitch/verification/cran/verify.R'; if($before -ne (Get-FileHash $profile -Algorithm SHA256).Hash -or $environBefore -ne (Get-FileHash $environ -Algorithm SHA256).Hash -or $prefsBefore -ne (Get-FileHash $prefs -Algorithm SHA256).Hash -or $projectBefore -ne (Get-FileHash (Join-Path $project 'renv.lock') -Algorithm SHA256).Hash -or (Test-Path $script)){throw 'CRAN state not restored exactly'}
      - name: Save redacted boundary evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: cran-native-${{ matrix.name }}-${{ github.run_id }}
          path: ${{ runner.temp }}/mirrorswitch-cran-boundary/home/project/*.json
          if-no-files-found: warn
          retention-days: 7
