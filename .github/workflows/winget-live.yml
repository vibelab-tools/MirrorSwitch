name: WinGet Windows live boundary

on:
  schedule:
    - cron: "23 0 * * 3"
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_TOOLCHAIN: 1.88.0

jobs:
  native:
    name: WinGet (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: windows-2025
          - arch: arm64
            runner: windows-11-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
      - name: Install Rust toolchain
        shell: pwsh
        run: |
          rustup toolchain install $env:RUST_TOOLCHAIN --profile minimal
          rustup default $env:RUST_TOOLCHAIN
      - name: Prepare existing WinGet agreement state
        if: matrix.arch == 'x86_64'
        shell: pwsh
        run: |
          winget --version
          winget search --id jqlang.jq --exact --source winget --accept-source-agreements --disable-interactivity
          winget source export --disable-interactivity | Set-Content -Encoding utf8 source-before.jsonl
      - name: Restore shared Rust dependency cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: native-boundary-v4-${{ hashFiles('Cargo.toml', 'Cargo.lock', 'src/**/*.rs', 'tests/**/*.rs') }}
          add-job-id-key: "false"
          cache-workspace-crates: "true"
          cache-bin: "false"
          cache-on-failure: "false"
      - name: Run deterministic WinGet adapter and restore boundaries
        run: cargo test --locked --test winget_adapter_boundary --test restore_dispatch_boundary -- --test-threads=1
      - name: Build native release executable
        run: cargo build --locked --release --bin mirrorswitch
      - name: Apply, verify, and explicitly restore a real WinGet plan
        if: matrix.arch == 'x86_64'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $binary = Join-Path $PWD 'target/release/mirrorswitch.exe'

          (& $binary status --offline --json) | Set-Content -Encoding utf8 status.json
          $status = Get-Content status.json -Raw | ConvertFrom-Json
          $tools = @($status.detected_tools | Where-Object adapter_key -eq 'winget')
          if ($tools.Count -ne 1) { throw 'WinGet adapter was not detected' }

          (& $binary plan --offline --tool winget --scope winget=system --json) | Set-Content -Encoding utf8 plan.json
          $plan = Get-Content plan.json -Raw | ConvertFrom-Json
          if (-not $plan.ok) { throw 'WinGet plan was not actionable' }
          $planned = @($plan.plan.tools)
          if ($planned.Count -ne 1 -or $planned[0].adapter_key -ne 'winget') { throw 'unexpected WinGet plan' }
          if (@($planned[0].selection.selections).Count -ne 1) { throw 'WinGet source was not selected atomically' }
          if (@($planned[0].plan.changes).Count -ne 1) { throw 'WinGet private recovery state is missing' }

          (& $binary apply --offline --tool winget --scope winget=system --yes --json) | Set-Content -Encoding utf8 apply.json
          $apply = Get-Content apply.json -Raw | ConvertFrom-Json
          if (-not $apply.result.successful) { throw 'WinGet apply failed' }
          $applied = @($apply.result.tools | Where-Object status -eq 'applied')
          if ($applied.Count -ne 1) { throw 'WinGet transaction was not applied' }
          $transactionId = $applied[0].receipt.transaction_id

          @('', 'n') | & $binary tui --offline --tool winget --scope winget=system | Set-Content -Encoding utf8 tui.txt
          if (-not ((Get-Content tui.txt) -match 'mirror=(nju|ustc)')) { throw 'WinGet TUI mirror missing' }
          (& $binary restore $transactionId --yes --json) | Set-Content -Encoding utf8 restore.json
          $restore = Get-Content restore.json -Raw | ConvertFrom-Json
          if (-not $restore.receipt.verified -or $restore.adapter_key -ne 'winget') { throw 'adapter-aware WinGet restore failed' }

          winget source export --disable-interactivity | Set-Content -Encoding utf8 source-after.jsonl
          if ((Get-Content source-before.jsonl -Raw) -ne (Get-Content source-after.jsonl -Raw)) { throw 'WinGet source export was not restored exactly' }
      - name: Confirm the native ARM64 availability boundary
        if: matrix.arch == 'arm64'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if (Get-Command winget -ErrorAction SilentlyContinue) { throw 'WinGet became available on the native ARM64 runner; enable its real source boundary' }

          $binary = Join-Path $PWD 'target/release/mirrorswitch.exe'
          (& $binary status --offline --json) | Set-Content -Encoding utf8 status.json
          $status = Get-Content status.json -Raw | ConvertFrom-Json
          if (@($status.detected_tools | Where-Object adapter_key -eq 'winget').Count -ne 0) { throw 'WinGet adapter was unexpectedly detected' }
          $notices = @($status.notices | Where-Object { $_.subject -eq 'winget' -and $_.code -eq 'tool-not-detected' })
          if ($notices.Count -ne 1) { throw 'WinGet ARM64 availability boundary was not reported explicitly' }
      - name: Save redacted boundary evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: winget-boundary-${{ matrix.arch }}-${{ github.run_id }}
          path: |
            plan.json
            apply.json
            status.json
            restore.json
            tui.txt
          if-no-files-found: warn
          retention-days: 7
