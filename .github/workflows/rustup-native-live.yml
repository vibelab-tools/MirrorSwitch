name: rustup macOS and Windows live boundary

on:
  schedule:
    - cron: "17 6 * * 3"
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_TOOLCHAIN: 1.88.0

jobs:
  native:
    name: rustup (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: macOS x86_64, runner: macos-15-intel }
          - { name: macOS arm64, runner: macos-15 }
          - { name: Windows x86_64, runner: windows-2025 }
          - { name: Windows arm64, runner: windows-11-arm }
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v7
      - name: Install Rust toolchain
        shell: bash
        run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal
          rustup default "$RUST_TOOLCHAIN"
          rustup --version
      - name: Restore shared Rust dependency cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: native-boundary
          add-job-id-key: "false"
          cache-bin: "false"
          cache-on-failure: "true"
      - name: Run deterministic rustup boundary
        run: cargo test --locked --test rustup_adapter_boundary --test transaction_boundary --test restore_dispatch_boundary -- --test-threads=1
      - name: Build native release executable
        run: cargo build --locked --release --bin mirrorswitch
      - name: Exercise macOS profile, host triples, and recovery
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -Eeuo pipefail
          binary="$PWD/target/release/mirrorswitch"; original_rustup_home=$(rustup show home); boundary="$RUNNER_TEMP/mirrorswitch-rustup-boundary"
          export RUSTUP_HOME="$original_rustup_home" HOME="$boundary/home" SHELL=/bin/zsh PROFILE="$boundary/home/.zshrc"
          unset RUSTUP_DIST_SERVER RUSTUP_UPDATE_ROOT RUSTUP_DIST_ROOT
          project="$HOME/project"; mkdir -p "$project"; printf '# native shell profile\nalias ll="ls -l"\n' > "$PROFILE"; chmod 0600 "$PROFILE"; printf '{"version":1,"tools":[{"id":"rustup","scope":"user"}]}\n' > "$project/request.json"
          before=$(shasum -a 256 "$PROFILE"|awk '{print $1}'); mode=$(stat -f '%Lp' "$PROFILE")
          cd "$project"
          "$binary" status --offline --json > status.json; "$binary" plan --offline --tool rustup --scope rustup=user --json > plan-cli.json; "$binary" plan --offline --config request.json --json > plan-config.json
          python3 - <<'PY'
          import json
          s=json.load(open('status.json')); assert [t['adapter_key'] for t in s['detected_tools'] if t['adapter_key']=='rustup']==['rustup']
          a=json.load(open('plan-cli.json')); b=json.load(open('plan-config.json')); assert a['ok'] and b['ok'] and a['plan']['tools'][0]['plan']==b['plan']['tools'][0]['plan']
          PY
          printf '\nn\n'|"$binary" tui --offline --tool rustup --scope rustup=user > tui.txt; grep -E 'mirror=(huaweicloud|ustc)' tui.txt
          "$binary" apply --offline --config request.json --yes --json > apply.json
          id=$(python3 - <<'PY'
          import json
          r=json.load(open('apply.json'))['result']; assert r['successful']; a=[t for t in r['tools'] if t['status']=='applied']; assert len(a)==1; print(a[0]['receipt']['transaction_id'])
          PY
          )
          "$binary" apply --offline --config request.json --yes --json > idempotent.json; "$binary" restore "$id" --yes --json > restore.json
          python3 - <<'PY'
          import json
          a=json.load(open('idempotent.json'))['result']; r=json.load(open('restore.json')); assert a['successful'] and not [t for t in a['tools'] if t['status']=='applied']; assert r['adapter_key']=='rustup' and r['receipt']['verified']
          PY
          test "$before" = "$(shasum -a 256 "$PROFILE"|awk '{print $1}')"; test "$mode" = "$(stat -f '%Lp' "$PROFILE")"
      - name: Exercise Windows HKCU environment, host triples, and recovery
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'; $binary=Join-Path $PWD 'target/release/mirrorswitch.exe'; $boundary=Join-Path $env:RUNNER_TEMP 'mirrorswitch-rustup-boundary'
          $env:LOCALAPPDATA=Join-Path $boundary 'AppData/Local'; New-Item -ItemType Directory -Force $env:LOCALAPPDATA,(Join-Path $boundary 'project')|Out-Null
          Remove-Item Env:RUSTUP_DIST_SERVER,Env:RUSTUP_UPDATE_ROOT,Env:RUSTUP_DIST_ROOT -ErrorAction SilentlyContinue
          $key=[Microsoft.Win32.Registry]::CurrentUser.OpenSubKey('Environment',$true); if($null -eq $key){throw 'HKCU Environment is unavailable'}
          $distBefore=$key.GetValue('RUSTUP_DIST_SERVER',$null,[Microsoft.Win32.RegistryValueOptions]::DoNotExpandEnvironmentNames); $updateBefore=$key.GetValue('RUSTUP_UPDATE_ROOT',$null,[Microsoft.Win32.RegistryValueOptions]::DoNotExpandEnvironmentNames)
          $distKind=if($null -ne $distBefore){$key.GetValueKind('RUSTUP_DIST_SERVER')}else{$null}; $updateKind=if($null -ne $updateBefore){$key.GetValueKind('RUSTUP_UPDATE_ROOT')}else{$null}; $key.Close()
          $project=Join-Path $boundary 'project'; '{"version":1,"tools":[{"id":"rustup","scope":"user"}]}'|Set-Content -Encoding utf8 (Join-Path $project 'request.json')
          Push-Location $project
          try{
            (& $binary status --offline --json)|Set-Content -Encoding utf8 status.json; (& $binary plan --offline --tool rustup --scope rustup=user --json)|Set-Content -Encoding utf8 plan-cli.json; (& $binary plan --offline --config request.json --json)|Set-Content -Encoding utf8 plan-config.json
            $s=Get-Content status.json -Raw|ConvertFrom-Json; if(@($s.detected_tools|Where-Object adapter_key -eq 'rustup').Count -ne 1){throw 'rustup not detected'}; $a=Get-Content plan-cli.json -Raw|ConvertFrom-Json; $b=Get-Content plan-config.json -Raw|ConvertFrom-Json; if(-not $a.ok -or -not $b.ok -or -not [string]::Equals([string]($a.plan.tools[0].plan|ConvertTo-Json -Depth 100 -Compress), [string]($b.plan.tools[0].plan|ConvertTo-Json -Depth 100 -Compress))){throw 'frontend plans differ'}
            @('','n')|& $binary tui --offline --tool rustup --scope rustup=user|Set-Content -Encoding utf8 tui.txt; if(-not((Get-Content tui.txt)-match 'mirror=(huaweicloud|ustc)')){throw 'rustup mirror missing'}
            (& $binary apply --offline --config request.json --yes --json)|Set-Content -Encoding utf8 apply.json; $r=Get-Content apply.json -Raw|ConvertFrom-Json; if(-not $r.result.successful){throw 'rustup apply failed'}; $applied=@($r.result.tools|Where-Object status -eq 'applied'); if($applied.Count -ne 1){throw 'transaction missing'}; $id=$applied[0].receipt.transaction_id
            (& $binary apply --offline --config request.json --yes --json)|Set-Content -Encoding utf8 idempotent.json; $again=Get-Content idempotent.json -Raw|ConvertFrom-Json; if(-not $again.result.successful -or @($again.result.tools|Where-Object status -eq 'applied').Count -ne 0){throw 'not idempotent'}
            (& $binary restore $id --yes --json)|Set-Content -Encoding utf8 restore.json; $restore=Get-Content restore.json -Raw|ConvertFrom-Json; if(-not $restore.receipt.verified -or $restore.adapter_key -ne 'rustup'){throw 'restore failed'}
          }finally{Pop-Location}
          $key=[Microsoft.Win32.Registry]::CurrentUser.OpenSubKey('Environment'); $distAfter=$key.GetValue('RUSTUP_DIST_SERVER',$null,[Microsoft.Win32.RegistryValueOptions]::DoNotExpandEnvironmentNames); $updateAfter=$key.GetValue('RUSTUP_UPDATE_ROOT',$null,[Microsoft.Win32.RegistryValueOptions]::DoNotExpandEnvironmentNames); if($distBefore -ne $distAfter -or $updateBefore -ne $updateAfter){throw 'rustup registry values were not restored'}; if($null -ne $distAfter -and $distKind -ne $key.GetValueKind('RUSTUP_DIST_SERVER')){throw 'dist registry type changed'}; if($null -ne $updateAfter -and $updateKind -ne $key.GetValueKind('RUSTUP_UPDATE_ROOT')){throw 'update registry type changed'}; $key.Close()
      - name: Save redacted boundary evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: rustup-native-${{ matrix.name }}-${{ github.run_id }}
          path: ${{ runner.temp }}/mirrorswitch-rustup-boundary/**/*.json
          if-no-files-found: warn
          retention-days: 7
