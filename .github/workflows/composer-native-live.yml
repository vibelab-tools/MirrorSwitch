name: Composer macOS and Windows live boundary

on:
  schedule:
    - cron: "39 6 * * 3"
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_TOOLCHAIN: 1.88.0

jobs:
  native:
    name: Composer (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: macOS x86_64, runner: macos-15-intel }
          - { name: macOS arm64, runner: macos-15 }
          - { name: Windows x86_64, runner: windows-2025 }
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          tools: composer:2.10.3
          coverage: none
      - name: Install Rust toolchain
        shell: bash
        run: |
          php --version && composer --version --no-ansi
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal
          rustup default "$RUST_TOOLCHAIN"
      - name: Restore shared Rust dependency cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: native-boundary
          add-job-id-key: "false"
          cache-bin: "false"
          cache-on-failure: "true"
      - name: Run deterministic Composer boundary
        run: cargo test --locked --test composer_adapter_boundary --test transaction_boundary --test restore_dispatch_boundary -- --test-threads=1
      - name: Build native release executable
        run: cargo build --locked --release --bin mirrorswitch
      - name: Exercise macOS COMPOSER_HOME, frontends, package query, and recovery
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -Eeuo pipefail
          binary="$PWD/target/release/mirrorswitch"; boundary="$RUNNER_TEMP/mirrorswitch-composer-boundary"; export HOME="$boundary/home"
          unset COMPOSER_HOME COMPOSER COMPOSER_AUTH COMPOSER_DISABLE_NETWORK COMPOSER_CAFILE
          project="$HOME/project"; mkdir -p "$HOME" "$project"
          composer_home=$(composer config --global home); case "$composer_home" in "$HOME"/*) ;; *) echo "Composer home is outside HOME: $composer_home" >&2; exit 1;; esac
          global="$composer_home/config.json"; global_auth="$composer_home/auth.json"; mkdir -p "$composer_home"
          printf '%s\n' '{' '  "config": {"secure-http": true, "process-timeout": 300},' '  "repositories": [' '    {"name":"private","type":"composer","url":"https://fixture:credential@packages.invalid.example/api","canonical":false}' '  ],' '  "extra": {"preserve": true}' '}' > "$global"; chmod 0600 "$global"
          printf '%s\n' '{"http-basic":{"packages.invalid.example":{"username":"fixture","password":"credential"}}}' > "$global_auth"; chmod 0600 "$global_auth"
          printf '%s\n' '{"repositories":[{"type":"vcs","url":"ssh://git@corp.example/project.git"}],"config":{"secure-http":true},"require":{"psr/log":"3.0.2"}}' > "$project/composer.json"; chmod 0400 "$project/composer.json"
          printf '%s\n' '{"packages":[],"packages-dev":[]}' > "$project/composer.lock"; chmod 0400 "$project/composer.lock"
          printf '%s\n' '{"bearer":{"packages.invalid.example":"project-fixture"}}' > "$project/auth.json"; chmod 0400 "$project/auth.json"
          export COMPOSER_AUTH='{"github-oauth":{"github.com":"environment-fixture"}}'
          printf '{"version":1,"tools":[{"id":"composer","scope":"user"}]}\n' > "$project/request.json"
          before=$(shasum -a 256 "$global"|awk '{print $1}'); global_auth_before=$(shasum -a 256 "$global_auth"|awk '{print $1}'); project_before=$(shasum -a 256 "$project/composer.json"|awk '{print $1}'); lock_before=$(shasum -a 256 "$project/composer.lock"|awk '{print $1}'); project_auth_before=$(shasum -a 256 "$project/auth.json"|awk '{print $1}'); mode=$(stat -f '%Lp' "$global")
          cd "$project"
          "$binary" status --offline --json > status.json; "$binary" plan --offline --tool composer --scope composer=user --json > plan-cli.json; "$binary" plan --offline --config request.json --json > plan-config.json
          python3 - "$global" "$composer_home" <<'PY'
          import json, sys
          status=json.load(open('status.json')); tools=[t for t in status['detected_tools'] if t['adapter_key']=='composer']; assert len(tools)==1
          evidence='\n'.join(tools[0]['detected']['evidence']); assert sys.argv[1] in evidence and sys.argv[2] in evidence and 'Macos' in evidence and 'project configuration' in evidence
          a=json.load(open('plan-cli.json')); b=json.load(open('plan-config.json')); assert a['ok'] and b['ok'] and a['plan']['tools'][0]['plan']==b['plan']['tools'][0]['plan']
          preview=open('status.json').read()+open('plan-cli.json').read()+open('plan-config.json').read(); assert 'fixture:credential' not in preview and 'environment-fixture' not in preview
          PY
          printf '\nn\n'|"$binary" tui --offline --tool composer --scope composer=user > tui.txt; grep -F 'mirror=huaweicloud' tui.txt; ! grep -E 'fixture:credential|environment-fixture' tui.txt
          "$binary" apply --offline --config request.json --yes --json > apply.json
          id=$(python3 - <<'PY'
          import json
          r=json.load(open('apply.json'))['result']; assert r['successful']; a=[t for t in r['tools'] if t['status']=='applied']; assert len(a)==1; print(a[0]['receipt']['transaction_id'])
          PY
          )
          composer config --global --list --source > native-config.txt; grep -F 'https://repo.huaweicloud.com/repository/php' native-config.txt
          "$binary" apply --offline --config request.json --yes --json > idempotent.json; "$binary" restore "$id" --yes --json > restore.json
          python3 - <<'PY'
          import json
          a=json.load(open('idempotent.json'))['result']; r=json.load(open('restore.json')); assert a['successful'] and not [t for t in a['tools'] if t['status']=='applied']; assert r['adapter_key']=='composer' and r['receipt']['verified']
          PY
          test "$before" = "$(shasum -a 256 "$global"|awk '{print $1}')"; test "$global_auth_before" = "$(shasum -a 256 "$global_auth"|awk '{print $1}')"; test "$project_before" = "$(shasum -a 256 composer.json|awk '{print $1}')"; test "$lock_before" = "$(shasum -a 256 composer.lock|awk '{print $1}')"; test "$project_auth_before" = "$(shasum -a 256 auth.json|awk '{print $1}')"; test "$mode" = "$(stat -f '%Lp' "$global")"; test ! -e "$HOME/.mirrorswitch/verification/composer/config.json"
      - name: Exercise Windows launcher, COMPOSER_HOME, frontends, query, and recovery
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'; $binary=Join-Path $PWD 'target/release/mirrorswitch.exe'; $boundary=Join-Path $env:RUNNER_TEMP 'mirrorswitch-composer-boundary'
          $env:USERPROFILE=Join-Path $boundary 'home'; $env:HOME=$env:USERPROFILE; $env:APPDATA=Join-Path $boundary 'AppData/Roaming'; $env:LOCALAPPDATA=Join-Path $boundary 'AppData/Local'; Remove-Item Env:COMPOSER_HOME,Env:COMPOSER,Env:COMPOSER_AUTH,Env:COMPOSER_DISABLE_NETWORK,Env:COMPOSER_CAFILE -ErrorAction SilentlyContinue
          $launcher=(Get-Command composer -CommandType Application|Select-Object -First 1).Source; if([IO.Path]::GetExtension($launcher) -notin @('.bat','.cmd')){throw "native Composer launcher is not a batch command: $launcher"}
          $project=Join-Path $env:USERPROFILE 'project'; New-Item -ItemType Directory -Force $env:USERPROFILE,$env:APPDATA,$env:LOCALAPPDATA,$project|Out-Null
          $composerHome=composer config --global home; if(-not([IO.Path]::GetFullPath($composerHome).StartsWith([IO.Path]::GetFullPath($env:USERPROFILE),[StringComparison]::OrdinalIgnoreCase))){throw "Composer home is outside USERPROFILE: $composerHome"}; $global=Join-Path $composerHome 'config.json'; $globalAuth=Join-Path $composerHome 'auth.json'; New-Item -ItemType Directory -Force $composerHome|Out-Null
          $config="{`r`n  `"config`": {`"secure-http`": true, `"process-timeout`": 300},`r`n  `"repositories`": [`r`n    {`"name`":`"private`",`"type`":`"composer`",`"url`":`"https://fixture:credential@packages.invalid.example/api`",`"canonical`":false}`r`n  ],`r`n  `"extra`": {`"preserve`": true}`r`n}`r`n"; [IO.File]::WriteAllText($global,$config,[Text.UTF8Encoding]::new($true)); [IO.File]::WriteAllText($globalAuth,'{"http-basic":{"packages.invalid.example":{"username":"fixture","password":"credential"}}}',[Text.UTF8Encoding]::new($false)); [IO.File]::WriteAllText((Join-Path $project 'composer.json'),'{"repositories":[{"type":"vcs","url":"ssh://git@corp.example/project.git"}],"config":{"secure-http":true},"require":{"psr/log":"3.0.2"}}',[Text.UTF8Encoding]::new($false)); [IO.File]::WriteAllText((Join-Path $project 'composer.lock'),'{"packages":[],"packages-dev":[]}',[Text.UTF8Encoding]::new($false)); [IO.File]::WriteAllText((Join-Path $project 'auth.json'),'{"bearer":{"packages.invalid.example":"project-fixture"}}',[Text.UTF8Encoding]::new($false)); Set-ItemProperty (Join-Path $project 'composer.json') IsReadOnly $true; Set-ItemProperty (Join-Path $project 'composer.lock') IsReadOnly $true; Set-ItemProperty (Join-Path $project 'auth.json') IsReadOnly $true; $env:COMPOSER_AUTH='{"github-oauth":{"github.com":"environment-fixture"}}'; [IO.File]::WriteAllText((Join-Path $project 'request.json'),'{"version":1,"tools":[{"id":"composer","scope":"user"}]}',[Text.UTF8Encoding]::new($false))
          $before=(Get-FileHash $global -Algorithm SHA256).Hash; $globalAuthBefore=(Get-FileHash $globalAuth -Algorithm SHA256).Hash; $projectBefore=(Get-FileHash (Join-Path $project 'composer.json') -Algorithm SHA256).Hash; $lockBefore=(Get-FileHash (Join-Path $project 'composer.lock') -Algorithm SHA256).Hash; $projectAuthBefore=(Get-FileHash (Join-Path $project 'auth.json') -Algorithm SHA256).Hash
          Push-Location $project
          try{
            (& $binary status --offline --json)|Set-Content -Encoding utf8 status.json; (& $binary plan --offline --tool composer --scope composer=user --json)|Set-Content -Encoding utf8 plan-cli.json; (& $binary plan --offline --config request.json --json)|Set-Content -Encoding utf8 plan-config.json
            $s=Get-Content status.json -Raw|ConvertFrom-Json; $tools=@($s.detected_tools|Where-Object adapter_key -eq 'composer'); if($tools.Count -ne 1){throw 'Composer not detected'}; $evidence=$tools[0].detected.evidence -join "`n"; if(-not $evidence.Contains($global) -or -not $evidence.Contains($composerHome) -or -not $evidence.Contains('Windows') -or -not $evidence.Contains('project configuration')){throw 'native path/platform evidence missing'}
            $a=Get-Content plan-cli.json -Raw|ConvertFrom-Json; $b=Get-Content plan-config.json -Raw|ConvertFrom-Json; if(-not $a.ok -or -not $b.ok -or -not [string]::Equals([string]($a.plan.tools[0].plan|ConvertTo-Json -Depth 100 -Compress), [string]($b.plan.tools[0].plan|ConvertTo-Json -Depth 100 -Compress))){throw 'frontend plans differ'}; if((Get-Content status.json,plan-cli.json,plan-config.json -Raw)-match 'fixture:credential|environment-fixture'){throw 'credential leaked in preview'}
            @('','n')|& $binary tui --offline --tool composer --scope composer=user|Set-Content -Encoding utf8 tui.txt; if(-not((Get-Content tui.txt)-match 'mirror=huaweicloud') -or (Get-Content tui.txt -Raw)-match 'fixture:credential|environment-fixture'){throw 'TUI output invalid'}
            (& $binary apply --offline --config request.json --yes --json)|Set-Content -Encoding utf8 apply.json; $r=Get-Content apply.json -Raw|ConvertFrom-Json; if(-not $r.result.successful){throw 'Composer apply failed'}; $applied=@($r.result.tools|Where-Object status -eq 'applied'); if($applied.Count -ne 1){throw 'transaction missing'}; $id=$applied[0].receipt.transaction_id
            (& composer config --global --list --source)|Set-Content -Encoding utf8 native-config.txt; if(-not((Get-Content native-config.txt)-match 'https://repo.huaweicloud.com/repository/php')){throw 'native Composer did not load selected global mirror'}
            (& $binary apply --offline --config request.json --yes --json)|Set-Content -Encoding utf8 idempotent.json; $again=Get-Content idempotent.json -Raw|ConvertFrom-Json; if(-not $again.result.successful -or @($again.result.tools|Where-Object status -eq 'applied').Count -ne 0){throw 'not idempotent'}; (& $binary restore $id --yes --json)|Set-Content -Encoding utf8 restore.json; $restore=Get-Content restore.json -Raw|ConvertFrom-Json; if(-not $restore.receipt.verified -or $restore.adapter_key -ne 'composer'){throw 'restore failed'}
          }finally{Pop-Location}
          $verification=Join-Path $env:USERPROFILE '.mirrorswitch/verification/composer/config.json'; if($before -ne (Get-FileHash $global -Algorithm SHA256).Hash -or $globalAuthBefore -ne (Get-FileHash $globalAuth -Algorithm SHA256).Hash -or $projectBefore -ne (Get-FileHash (Join-Path $project 'composer.json') -Algorithm SHA256).Hash -or $lockBefore -ne (Get-FileHash (Join-Path $project 'composer.lock') -Algorithm SHA256).Hash -or $projectAuthBefore -ne (Get-FileHash (Join-Path $project 'auth.json') -Algorithm SHA256).Hash -or (Test-Path $verification)){throw 'Composer state not restored exactly'}
      - name: Save redacted boundary evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: composer-native-${{ matrix.name }}-${{ github.run_id }}
          path: ${{ runner.temp }}/mirrorswitch-composer-boundary/home/project/*.json
          if-no-files-found: warn
          retention-days: 7
