name: tlmgr macOS and Windows live boundary

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_TOOLCHAIN: 1.88.0

jobs:
  native:
    name: tlmgr (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: macOS x86_64, runner: macos-15-intel }
          - { name: macOS arm64, runner: macos-15 }
          - { name: Windows x86_64, runner: windows-2025 }
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: TeX-Live/setup-texlive-action@v4
        with:
          version: "2026"
          cache: false
          repository: https://mirrors.nju.edu.cn/CTAN/systems/texlive/tlnet
      - name: Validate TeX Live and install Rust on macOS
        if: runner.os == 'macOS'
        shell: bash
        run: |
          tlmgr --version
          tlmgr print-platform
          kpsewhich -var-value=TEXMFHOME
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal
          rustup default "$RUST_TOOLCHAIN"
      - name: Validate TeX Live and install Rust on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          tlmgr --version; if($LASTEXITCODE -ne 0){throw 'tlmgr version failed'}
          tlmgr print-platform; if($LASTEXITCODE -ne 0){throw 'tlmgr platform discovery failed'}
          kpsewhich -var-value=TEXMFHOME; if($LASTEXITCODE -ne 0){throw 'TEXMFHOME discovery failed'}
          rustup toolchain install $env:RUST_TOOLCHAIN --profile minimal
          rustup default $env:RUST_TOOLCHAIN
      - name: Restore shared Rust dependency cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: native-boundary-v4-${{ hashFiles('Cargo.toml', 'Cargo.lock', 'src/**/*.rs', 'tests/**/*.rs') }}
          add-job-id-key: "false"
          cache-workspace-crates: "true"
          cache-bin: "false"
          cache-on-failure: "false"
      - name: Run deterministic tlmgr boundary
        run: cargo test --locked --test tlmgr_adapter_boundary --test transaction_boundary --test restore_dispatch_boundary -- --test-threads=1
      - name: Build native release executable
        run: cargo build --locked --release --bin mirrorswitch
      - name: Exercise macOS installation tree, user mode, frontends, and recovery
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -Eeuo pipefail
          binary="$PWD/target/release/mirrorswitch"; boundary="$RUNNER_TEMP/mirrorswitch-tlmgr-boundary"
          project="$boundary/project"; mkdir -p "$project"
          tlmgr init-usertree
          tlmgr --usermode option repository https://mirror.ctan.org/systems/texlive/tlnet
          texmfhome=$(kpsewhich -var-value=TEXMFHOME); user_db="$texmfhome/tlpkg/texlive.tlpdb"; root=$(tlmgr --version|sed -n 's/^tlmgr using installation: //p'); system_db="$root/tlpkg/texlive.tlpdb"
          printf '%s\n' 'TEXINPUTS=./private//' > "$project/texlive.project"; chmod 0400 "$project/texlive.project"
          printf '{"version":1,"tools":[{"id":"tlmgr","scope":"user","mirrors":{"ctan--language-registry":"14d922d2ede9c4af514f0929"}}]}\n' > "$project/request.json"
          user_before=$(shasum -a 256 "$user_db"|awk '{print $1}'); system_before=$(shasum -a 256 "$system_db"|awk '{print $1}'); project_before=$(shasum -a 256 "$project/texlive.project"|awk '{print $1}'); mode=$(stat -f '%Lp' "$user_db")
          cd "$project"
          "$binary" status --offline --json > status.json; "$binary" plan --offline --tool tlmgr --scope tlmgr=user --mirror tlmgr:ctan--language-registry=14d922d2ede9c4af514f0929 --json > plan-cli.json; "$binary" plan --offline --config request.json --json > plan-config.json
          python3 - "$root" "$user_db" <<'PY'
          import json, pathlib, sys
          status=json.load(open('status.json')); tools=[t for t in status['detected_tools'] if t['adapter_key']=='tlmgr']; assert len(tools)==1
          evidence='\n'.join(tools[0]['detected']['evidence']); assert sys.argv[1] in evidence and str(pathlib.Path.cwd()) in evidence and 'selected user home is ' in evidence and 'Macos' in evidence and 'universal-darwin' in evidence
          a=json.load(open('plan-cli.json')); b=json.load(open('plan-config.json')); assert a['ok'] and b['ok'] and a['plan']['tools'][0]['plan']==b['plan']['tools'][0]['plan']
          assert pathlib.Path(a['plan']['tools'][0]['plan']['changes'][0]['target']) == pathlib.Path(sys.argv[2])
          PY
          printf '\nn\n'|"$binary" tui --offline --tool tlmgr --scope tlmgr=user --mirror tlmgr:ctan--language-registry=14d922d2ede9c4af514f0929 > tui.txt; grep -F 'mirror=nju' tui.txt
          "$binary" apply --offline --config request.json --yes --json > apply.json
          id=$(python3 - <<'PY'
          import json
          r=json.load(open('apply.json'))['result']; assert r['successful']; a=[t for t in r['tools'] if t['status']=='applied']; assert len(a)==1 and a[0]['verification']['valid']; print(a[0]['receipt']['transaction_id'])
          PY
          )
          tlmgr --usermode repository list|grep -E 'mirrors\.(aliyun|nju|tuna)|repo\.huaweicloud\.com'
          "$binary" apply --offline --config request.json --yes --json > idempotent.json; "$binary" restore "$id" --yes --json > restore.json
          python3 - <<'PY'
          import json
          a=json.load(open('idempotent.json'))['result']; r=json.load(open('restore.json')); assert a['successful'] and not [t for t in a['tools'] if t['status']=='applied']; assert r['adapter_key']=='tlmgr' and r['receipt']['verified']
          PY
          test "$user_before" = "$(shasum -a 256 "$user_db"|awk '{print $1}')"; test "$system_before" = "$(shasum -a 256 "$system_db"|awk '{print $1}')"; test "$project_before" = "$(shasum -a 256 texlive.project|awk '{print $1}')"; test "$mode" = "$(stat -f '%Lp' "$user_db")"
      - name: Exercise Windows installation tree, user mode, frontends, and recovery
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'; $binary=Join-Path $PWD 'target/release/mirrorswitch.exe'; $boundary=Join-Path $env:RUNNER_TEMP 'mirrorswitch-tlmgr-boundary'
          $env:TEXMFHOME=Join-Path $env:USERPROFILE 'texmf'
          $launcher=(Get-Command tlmgr -CommandType Application|Select-Object -First 1).Source; if([IO.Path]::GetExtension($launcher) -notin @('.bat','.exe')){throw "native tlmgr launcher is not Windows-compatible: $launcher"}
          tlmgr init-usertree; if($LASTEXITCODE -ne 0){throw 'tlmgr user tree initialization failed'}; tlmgr --usermode option repository https://mirror.ctan.org/systems/texlive/tlnet; if($LASTEXITCODE -ne 0){throw 'tlmgr user repository initialization failed'}
          $texmfhome=(kpsewhich -var-value=TEXMFHOME) -join ''; $userDb=Join-Path $texmfhome 'tlpkg/texlive.tlpdb'; $version=(tlmgr --version) -join "`n"; $root=($version -split "`n"|Where-Object {$_ -like 'tlmgr using installation:*'}|Select-Object -First 1).Substring('tlmgr using installation: '.Length); $systemDb=Join-Path $root 'tlpkg/texlive.tlpdb'
          $project=Join-Path $boundary 'project'; New-Item -ItemType Directory -Force $project|Out-Null; [IO.File]::WriteAllText((Join-Path $project 'texlive.project'),"TEXINPUTS=./private//`r`n",[Text.UTF8Encoding]::new($false)); Set-ItemProperty (Join-Path $project 'texlive.project') IsReadOnly $true; [IO.File]::WriteAllText((Join-Path $project 'request.json'),'{"version":1,"tools":[{"id":"tlmgr","scope":"user","mirrors":{"ctan--language-registry":"14d922d2ede9c4af514f0929"}}]}',[Text.UTF8Encoding]::new($false))
          $userBefore=(Get-FileHash $userDb -Algorithm SHA256).Hash; $systemBefore=(Get-FileHash $systemDb -Algorithm SHA256).Hash; $projectBefore=(Get-FileHash (Join-Path $project 'texlive.project') -Algorithm SHA256).Hash
          Push-Location $project
          try{
            (& $binary status --offline --json)|Set-Content -Encoding utf8 status.json; (& $binary plan --offline --tool tlmgr --scope tlmgr=user --mirror tlmgr:ctan--language-registry=14d922d2ede9c4af514f0929 --json)|Set-Content -Encoding utf8 plan-cli.json; (& $binary plan --offline --config request.json --json)|Set-Content -Encoding utf8 plan-config.json
            $s=Get-Content status.json -Raw|ConvertFrom-Json; $tools=@($s.detected_tools|Where-Object adapter_key -eq 'tlmgr'); if($tools.Count -ne 1){throw 'tlmgr not detected'}; $evidence=($tools[0].detected.evidence -join "`n").Replace('/','\'); if(-not $evidence.Contains($root.Replace('/','\')) -or -not $evidence.Contains($project.Replace('/','\')) -or -not $evidence.Contains('selected user home is ') -or -not $evidence.Contains('Windows') -or -not $evidence.Contains('TeX Live platform windows')){throw 'native path/platform evidence missing'}
            $a=Get-Content plan-cli.json -Raw|ConvertFrom-Json; $b=Get-Content plan-config.json -Raw|ConvertFrom-Json; if(-not $a.ok -or -not $b.ok -or -not [string]::Equals([string]($a.plan.tools[0].plan|ConvertTo-Json -Depth 100 -Compress), [string]($b.plan.tools[0].plan|ConvertTo-Json -Depth 100 -Compress))){throw 'frontend plans differ'}
            if($a.plan.tools[0].plan.changes[0].target.Replace('/','\') -ne $userDb.Replace('/','\')){throw 'user tree target mismatch'}
            @('','n')|& $binary tui --offline --tool tlmgr --scope tlmgr=user --mirror tlmgr:ctan--language-registry=14d922d2ede9c4af514f0929|Set-Content -Encoding utf8 tui.txt; if(-not((Get-Content tui.txt)-match 'mirror=nju')){throw 'tlmgr mirror missing'}
            (& $binary apply --offline --config request.json --yes --json)|Set-Content -Encoding utf8 apply.json; $r=Get-Content apply.json -Raw|ConvertFrom-Json; if(-not $r.result.successful){throw 'tlmgr apply failed'}; $applied=@($r.result.tools|Where-Object status -eq 'applied'); if($applied.Count -ne 1 -or -not $applied[0].verification.valid){throw 'verified transaction missing'}; $id=$applied[0].receipt.transaction_id
            $repositories=(tlmgr --usermode repository list) -join "`n"; if($repositories -notmatch 'mirrors\.(aliyun|nju|tuna)|repo\.huaweicloud\.com'){throw 'native tlmgr did not load selected repository'}
            (& $binary apply --offline --config request.json --yes --json)|Set-Content -Encoding utf8 idempotent.json; $again=Get-Content idempotent.json -Raw|ConvertFrom-Json; if(-not $again.result.successful -or @($again.result.tools|Where-Object status -eq 'applied').Count -ne 0){throw 'not idempotent'}; (& $binary restore $id --yes --json)|Set-Content -Encoding utf8 restore.json; $restore=Get-Content restore.json -Raw|ConvertFrom-Json; if(-not $restore.receipt.verified -or $restore.adapter_key -ne 'tlmgr'){throw 'restore failed'}
          }finally{Pop-Location}
          if($userBefore -ne (Get-FileHash $userDb -Algorithm SHA256).Hash -or $systemBefore -ne (Get-FileHash $systemDb -Algorithm SHA256).Hash -or $projectBefore -ne (Get-FileHash (Join-Path $project 'texlive.project') -Algorithm SHA256).Hash){throw 'tlmgr state not restored exactly'}
      - name: Save redacted boundary evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: tlmgr-native-${{ matrix.name }}-${{ github.run_id }}
          path: ${{ runner.temp }}/mirrorswitch-tlmgr-boundary/project/*.json
          if-no-files-found: warn
          retention-days: 7
