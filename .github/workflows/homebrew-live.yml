name: Homebrew live boundary

on:
  schedule:
    - cron: "41 20 * * 2"
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_TOOLCHAIN: 1.88.0

jobs:
  native:
    name: Homebrew (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: macos-15-intel
          - arch: arm64
            runner: macos-15
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7
      - name: Install Rust toolchain
        run: rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal && rustup default "$RUST_TOOLCHAIN"
      - name: Restore shared Rust dependency cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: native-boundary-v2
          key: ${{ hashFiles('Cargo.toml', 'Cargo.lock', 'src/**/*.rs', 'tests/**/*.rs') }}
          add-job-id-key: "false"
          cache-workspace-crates: "true"
          cache-bin: "false"
          cache-on-failure: "true"
      - name: Run deterministic Homebrew adapter boundary
        run: cargo test --locked --test homebrew_adapter_boundary -- --test-threads=1
      - name: Build native release executable
        run: cargo build --locked --release --bin mirrorswitch
      - name: Apply, verify, and restore a real Homebrew plan
        shell: bash
        run: |
          set -Eeuo pipefail
          binary="$PWD/target/release/mirrorswitch"
          profile="$HOME/.mirrorswitch-homebrew-ci-profile"
          : > "$profile"
          export PROFILE="$profile"
          unset HOMEBREW_BREW_GIT_REMOTE HOMEBREW_API_DOMAIN HOMEBREW_ARTIFACT_DOMAIN HOMEBREW_BOTTLE_DOMAIN HOMEBREW_NO_INSTALL_FROM_API
          repository=$(brew --repository)
          profile_before=$(shasum -a 256 "$profile" | awk '{print $1}')
          git_before=$(shasum -a 256 "$repository/.git/config" | awk '{print $1}')

          "$binary" status --offline --json > status.json
          python3 - <<'PY'
          import json
          status = json.load(open("status.json"))
          print({
              "tools": [item["adapter_key"] for item in status["detected_tools"] if item["adapter_key"] == "homebrew"],
              "notices": [item for item in status["notices"] if item["subject"] == "homebrew"],
          })
          PY
          "$binary" plan --offline --tool homebrew --json > plan.json
          python3 - <<'PY'
          import json
          plan = json.load(open("plan.json"))
          assert plan["ok"] is True
          assert [item["adapter_key"] for item in plan["plan"]["tools"]] == ["homebrew"]
          assert {item["provider_id"] for item in plan["plan"]["tools"][0]["selection"]["selections"]} == {"ustc"}
          PY

          "$binary" apply --offline --tool homebrew --yes --json > apply.json
          transaction_id=$(python3 - <<'PY'
          import json
          result = json.load(open("apply.json"))["result"]
          assert result["successful"] is True
          applied = [item for item in result["tools"] if item["status"] == "applied"]
          assert len(applied) == 1
          print(applied[0]["receipt"]["transaction_id"])
          PY
          )
          printf '\nn\n' | "$binary" tui --offline --tool homebrew > tui.txt
          grep -F 'mirror=ustc' tui.txt
          "$binary" restore "$transaction_id" --yes --json > restore.json
          python3 - <<'PY'
          import json
          assert json.load(open("restore.json"))["receipt"]["verified"] is True
          PY

          test "$profile_before" = "$(shasum -a 256 "$profile" | awk '{print $1}')"
          test "$git_before" = "$(shasum -a 256 "$repository/.git/config" | awk '{print $1}')"
      - name: Save redacted boundary evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: homebrew-boundary-${{ matrix.arch }}-${{ github.run_id }}
          path: |
            plan.json
            apply.json
            status.json
            restore.json
            tui.txt
          if-no-files-found: warn
          retention-days: 7
