name: Linux CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_TOOLCHAIN: 1.88.0

jobs:
  quality-and-tests:
    name: Quality and Rust boundary tests
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - name: Install Rust toolchain
        run: rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --component rustfmt,clippy && rustup default "$RUST_TOOLCHAIN"
      - name: Check formatting and Clippy
        run: bash scripts/test.sh quality
      - name: Run adapter coverage and Rust tests
        run: bash scripts/test.sh unit
      - name: Run representative language adapters
        run: bash scripts/test.sh language

  terminal-binaries:
    name: Terminal binary (${{ matrix.arch }})
    needs: quality-and-tests
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-24.04
            rust_target: x86_64-unknown-linux-musl
          - arch: arm64
            runner: ubuntu-24.04-arm
            rust_target: aarch64-unknown-linux-musl
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - name: Install Rust toolchain
        run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal
          rustup default "$RUST_TOOLCHAIN"
          rustup target add "${{ matrix.rust_target }}"
          sudo apt-get update
          sudo apt-get install --yes musl-tools
      - name: Build and exercise read-only terminal commands
        run: |
          cargo build --locked --release --target "${{ matrix.rust_target }}" --bin mirrorswitch
          MIRRORSWITCH_BINARY="$PWD/target/${{ matrix.rust_target }}/release/mirrorswitch" bash scripts/test.sh cli
      - name: Exercise native Debian and APT boundary
        run: bash scripts/test.sh distro debian
      - name: Record verified binary checksum
        run: cd "target/${{ matrix.rust_target }}/release" && sha256sum mirrorswitch > mirrorswitch.sha256
      - name: Save binary for packaging
        uses: actions/upload-artifact@v7
        with:
          name: mirrorswitch-linux-${{ matrix.arch }}
          path: |
            target/${{ matrix.rust_target }}/release/mirrorswitch
            target/${{ matrix.rust_target }}/release/mirrorswitch.sha256
          if-no-files-found: error
          retention-days: 14

  distribution-matrix:
    name: Linux distribution matrix
    needs: quality-and-tests
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - name: Install Rust toolchain
        run: rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal && rustup default "$RUST_TOOLCHAIN"
      - name: Run real package-manager boundaries
        run: bash scripts/test.sh docker

  packages:
    name: Linux packages (${{ matrix.arch }})
    needs: [terminal-binaries, distribution-matrix]
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-24.04
            docker_platform: linux/amd64
          - arch: arm64
            runner: ubuntu-24.04-arm
            docker_platform: linux/arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - name: Read package version
        id: metadata
        run: echo "version=$(sed -n 's/^version = \"\([^\"]*\)\"/\1/p' Cargo.toml | sed -n '1p')" >> "$GITHUB_OUTPUT"
      - name: Download the tested binary
        uses: actions/download-artifact@v8
        with:
          name: mirrorswitch-linux-${{ matrix.arch }}
          path: input
      - name: Verify the binary handoff
        run: cd input && sha256sum -c mirrorswitch.sha256 && chmod 0755 mirrorswitch
      - name: Install RPM build tooling
        run: sudo apt-get update && sudo apt-get install --yes rpm
      - name: Build archive, deb, and rpm from the tested binary
        run: scripts/package-linux.sh input/mirrorswitch "${{ matrix.arch }}" dist
      - name: Test archive and deb installation
        run: |
          source tests/docker/images.env
          docker run --rm --network none --platform "${{ matrix.docker_platform }}" \
            -e MIRRORSWITCH_PACKAGE_ARCH="${{ matrix.arch }}" \
            -e MIRRORSWITCH_PACKAGE_FORMAT=archive \
            -e MIRRORSWITCH_VERSION="${{ steps.metadata.outputs.version }}" \
            -v "$PWD/dist:/packages:ro" \
            -v "$PWD/tests/docker/install-package.sh:/test-package.sh:ro" \
            "$DEBIAN_IMAGE" /bin/sh /test-package.sh
          docker run --rm --network none --platform "${{ matrix.docker_platform }}" \
            -e MIRRORSWITCH_PACKAGE_ARCH="${{ matrix.arch }}" \
            -e MIRRORSWITCH_PACKAGE_FORMAT=deb \
            -e MIRRORSWITCH_VERSION="${{ steps.metadata.outputs.version }}" \
            -v "$PWD/dist:/packages:ro" \
            -v "$PWD/tests/docker/install-package.sh:/test-package.sh:ro" \
            "$DEBIAN_IMAGE" /bin/sh /test-package.sh
          docker run --rm --network none --platform "${{ matrix.docker_platform }}" \
            -e MIRRORSWITCH_PACKAGE_ARCH="${{ matrix.arch }}" \
            -e MIRRORSWITCH_PACKAGE_FORMAT=deb \
            -e MIRRORSWITCH_VERSION="${{ steps.metadata.outputs.version }}" \
            -v "$PWD/dist:/packages:ro" \
            -v "$PWD/tests/docker/install-package.sh:/test-package.sh:ro" \
            "$UBUNTU_IMAGE" /bin/sh /test-package.sh
      - name: Test archive installation on Arch Linux
        if: matrix.arch == 'x86_64'
        run: |
          source tests/docker/images.env
          docker run --rm --network none --platform linux/amd64 \
            -e MIRRORSWITCH_PACKAGE_ARCH=x86_64 \
            -e MIRRORSWITCH_PACKAGE_FORMAT=archive \
            -e MIRRORSWITCH_VERSION="${{ steps.metadata.outputs.version }}" \
            -v "$PWD/dist:/packages:ro" \
            -v "$PWD/tests/docker/install-package.sh:/test-package.sh:ro" \
            "$ARCH_IMAGE" /bin/sh /test-package.sh
      - name: Test rpm installation
        run: |
          source tests/docker/images.env
          docker run --rm --network none --platform "${{ matrix.docker_platform }}" \
            -e MIRRORSWITCH_PACKAGE_ARCH="${{ matrix.arch }}" \
            -e MIRRORSWITCH_PACKAGE_FORMAT=rpm \
            -e MIRRORSWITCH_VERSION="${{ steps.metadata.outputs.version }}" \
            -v "$PWD/dist:/packages:ro" \
            -v "$PWD/tests/docker/install-package.sh:/test-package.sh:ro" \
            "$FEDORA_IMAGE" /bin/sh /test-package.sh
          docker run --rm --network none --platform "${{ matrix.docker_platform }}" \
            -e MIRRORSWITCH_PACKAGE_ARCH="${{ matrix.arch }}" \
            -e MIRRORSWITCH_PACKAGE_FORMAT=rpm \
            -e MIRRORSWITCH_VERSION="${{ steps.metadata.outputs.version }}" \
            -v "$PWD/dist:/packages:ro" \
            -v "$PWD/tests/docker/install-package.sh:/test-package.sh:ro" \
            "$ROCKY_IMAGE" /bin/sh /test-package.sh
      - name: Verify package checksums
        run: cd dist && sha256sum -c SHA256SUMS
      - name: Save packages for release
        uses: actions/upload-artifact@v7
        with:
          name: mirrorswitch-packages-linux-${{ matrix.arch }}
          path: dist/
          if-no-files-found: error
          retention-days: 14

  native-release-packages:
    name: Native release package (${{ matrix.platform }} ${{ matrix.arch }})
    if: startsWith(github.ref, 'refs/tags/v0.2.')
    needs: quality-and-tests
    strategy:
      fail-fast: false
      matrix:
        include:
          - { platform: macos, arch: x86_64, runner: macos-15-intel, rust_host: x86_64-apple-darwin }
          - { platform: macos, arch: arm64, runner: macos-15, rust_host: aarch64-apple-darwin }
          - { platform: windows, arch: x86_64, runner: windows-2025, rust_host: x86_64-pc-windows-msvc }
          - { platform: windows, arch: arm64, runner: windows-11-arm, rust_host: aarch64-pc-windows-msvc }
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7
      - name: Install Rust toolchain
        shell: bash
        run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal
          rustup default "$RUST_TOOLCHAIN"
          rustc -vV|grep -F 'host: ${{ matrix.rust_host }}'
      - name: Run native transaction and host boundaries
        run: cargo test --locked --test host_detection_boundary --test transaction_boundary --test restore_dispatch_boundary --test catalog_contract --test catalog_runtime_contract -- --test-threads=1
      - name: Build and exercise macOS executable
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -Eeuo pipefail
          export MACOSX_DEPLOYMENT_TARGET=14.0
          cargo build --locked --release --bin mirrorswitch
          binary="$PWD/target/release/mirrorswitch"; version=$(sed -n 's/^version = "\([^"]*\)"/\1/p' Cargo.toml|sed -n '1p')
          otool -l "$binary"|awk '/LC_BUILD_VERSION/{found=1} found && /minos/{print; exit}'|grep -F '14.0'
          "$binary" --version|grep -F "mirrorswitch $version"; "$binary" --help|grep -F 'mirrorswitch detect'; "$binary" detect --offline --json > native-detect.json
          signature=$(codesign -dv --verbose=4 "$binary" 2>&1 || true); printf '%s\n' "$signature"; printf '%s\n' "$signature"|grep -Eq 'Signature=adhoc|code object is not signed at all'; ! printf '%s\n' "$signature"|grep -F 'Authority=Developer ID'
          echo 'macOS archive status: no Developer ID signature or notarization'
          python3 - <<'PY'
          import json
          report=json.load(open('native-detect.json')); assert report['ok'] and report['report']['context']['os']=='macos'
          PY
          root="$RUNNER_TEMP/mirrorswitch-$version-macos-${{ matrix.arch }}"; output="$PWD/dist-native"; mkdir -p "$root" "$output"
          install -m 0755 "$binary" "$root/mirrorswitch"; install -m 0644 LICENSE README.md "$root/"
          archive="mirrorswitch-$version-macos-${{ matrix.arch }}.tar.gz"; tar -C "$RUNNER_TEMP" -czf "$output/$archive" "$(basename "$root")"
          (cd "$output" && shasum -a 256 "$archive" > SHA256SUMS && shasum -a 256 -c SHA256SUMS)
          extract="$RUNNER_TEMP/native-package-check"; mkdir -p "$extract"; tar -xzf "$output/$archive" -C "$extract"; packaged="$extract/$(basename "$root")/mirrorswitch"
          "$packaged" --version|grep -F "mirrorswitch $version"; "$packaged" --help|grep -F 'mirrorswitch detect'; "$packaged" detect --offline --json >/dev/null
      - name: Build and exercise Windows executable
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'; cargo build --locked --release --bin mirrorswitch; if($LASTEXITCODE -ne 0){throw 'native release build failed'}
          $binary=Join-Path $PWD 'target/release/mirrorswitch.exe'; $version=(Select-String -Path Cargo.toml -Pattern '^version = "([^"]+)"').Matches[0].Groups[1].Value
          if(-not((& $binary --version)-match "mirrorswitch $version")){throw 'version mismatch'}; if(-not((& $binary --help)-match 'mirrorswitch detect')){throw 'help mismatch'}; (& $binary detect --offline --json)|Set-Content -Encoding utf8 native-detect.json
          $report=Get-Content native-detect.json -Raw|ConvertFrom-Json; if(-not $report.ok -or $report.report.context.os -ne 'windows'){throw 'native detect mismatch'}
          $name="mirrorswitch-$version-windows-${{ matrix.arch }}"; $root=Join-Path $env:RUNNER_TEMP $name; $output=Join-Path $PWD 'dist-native'; New-Item -ItemType Directory -Force $root,$output|Out-Null
          Copy-Item $binary (Join-Path $root 'mirrorswitch.exe'); Copy-Item LICENSE,README.md $root
          $archive="$name.zip"; Compress-Archive -Path $root -DestinationPath (Join-Path $output $archive) -CompressionLevel Optimal
          $digest=(Get-FileHash (Join-Path $output $archive) -Algorithm SHA256).Hash.ToLowerInvariant(); "$digest  $archive"|Set-Content -Encoding ascii (Join-Path $output 'SHA256SUMS')
          $extract=Join-Path $env:RUNNER_TEMP 'native-package-check'; Expand-Archive (Join-Path $output $archive) -DestinationPath $extract; $packaged=Join-Path $extract "$name/mirrorswitch.exe"
          if(-not((& $packaged --version)-match "mirrorswitch $version")){throw 'packaged version mismatch'}; if(-not((& $packaged --help)-match 'mirrorswitch detect')){throw 'packaged help mismatch'}; $native=(& $packaged detect --offline --json)|ConvertFrom-Json; if(-not $native.ok -or $native.report.context.os -ne 'windows'){throw 'packaged detect mismatch'}
      - name: Save tested native package
        uses: actions/upload-artifact@v7
        with:
          name: mirrorswitch-packages-${{ matrix.platform }}-${{ matrix.arch }}
          path: dist-native/
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish GitHub release
    if: >-
      always() && startsWith(github.ref, 'refs/tags/v') &&
      needs.packages.result == 'success' &&
      (!startsWith(github.ref, 'refs/tags/v0.2.') || needs.native-release-packages.result == 'success')
    needs: [packages, native-release-packages]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - name: Download verified package artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: mirrorswitch-packages-*
          path: release-input
      - name: Prepare one release asset set
        run: scripts/prepare-release.sh release-input release-files "$GITHUB_REF_NAME"
      - name: Publish immutable tag assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" release-files/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "MirrorSwitch $GITHUB_REF_NAME" \
            --notes-file "docs/releases/$GITHUB_REF_NAME.md"
          expected=7; case "$GITHUB_REF_NAME" in v0.2.*) expected=11 ;; esac
          test "$(gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets | length')" -eq "$expected"
