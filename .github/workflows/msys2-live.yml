name: MSYS2 Windows live boundary

on:
  schedule:
    - cron: "47 23 * * 2"
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_TOOLCHAIN: 1.88.0

jobs:
  native:
    name: MSYS2 (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: windows-2025
            msystem: UCRT64
          - arch: arm64
            runner: windows-11-arm
            msystem: CLANGARM64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - name: Install Rust toolchain
        shell: pwsh
        run: |
          rustup toolchain install $env:RUST_TOOLCHAIN --profile minimal
          rustup default $env:RUST_TOOLCHAIN
      - name: Install and update MSYS2
        id: msys2
        uses: msys2/setup-msys2@66cd2cce69caa17b53920067426061ca1de3a884 # v2
        with:
          location: C:\msys64
          msystem: ${{ matrix.msystem }}
          update: true
      - name: Restore shared Rust dependency cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: native-boundary
          add-job-id-key: "false"
          cache-bin: "false"
          cache-on-failure: "true"
      - name: Run deterministic MSYS2 adapter boundary
        run: cargo test --locked --test msys2_adapter_boundary -- --test-threads=1
      - name: Build native release executable
        run: cargo build --locked --release --bin mirrorswitch
      - name: Apply, verify, and restore a real MSYS2 plan
        shell: pwsh
        env:
          MSYS2_ROOT: ${{ steps.msys2.outputs.msys2-location }}
          MSYSTEM: ${{ matrix.msystem }}
        run: |
          $ErrorActionPreference = 'Stop'
          $binary = Join-Path $PWD 'target/release/mirrorswitch.exe'
          $msys = Join-Path $env:MSYS2_ROOT 'etc/pacman.d/mirrorlist.msys'
          $mingw = Join-Path $env:MSYS2_ROOT 'etc/pacman.d/mirrorlist.mingw'
          $msysBefore = (Get-FileHash $msys -Algorithm SHA256).Hash
          $mingwBefore = (Get-FileHash $mingw -Algorithm SHA256).Hash

          (& $binary status --offline --json) | Set-Content -Encoding utf8 status.json
          $status = Get-Content status.json -Raw | ConvertFrom-Json
          $tools = @($status.detected_tools | Where-Object adapter_key -eq 'msys2')
          if ($tools.Count -ne 1) { throw 'MSYS2 adapter was not detected' }

          (& $binary plan --offline --tool msys2 --scope msys2=system --json) | Set-Content -Encoding utf8 plan.json
          $plan = Get-Content plan.json -Raw | ConvertFrom-Json
          if (-not $plan.ok) { throw 'MSYS2 plan was not actionable' }
          $planned = @($plan.plan.tools)
          if ($planned.Count -ne 1 -or $planned[0].adapter_key -ne 'msys2') { throw 'unexpected MSYS2 plan' }
          if (@($planned[0].selection.selections).Count -ne 1) { throw 'MSYS2 mirror pair was not selected atomically' }
          if (@($planned[0].plan.changes).Count -ne 2) { throw 'both MSYS2 mirrorlists must change' }

          (& $binary apply --offline --tool msys2 --scope msys2=system --yes --json) | Set-Content -Encoding utf8 apply.json
          $apply = Get-Content apply.json -Raw | ConvertFrom-Json
          if (-not $apply.result.successful) { throw 'MSYS2 apply failed' }
          $applied = @($apply.result.tools | Where-Object status -eq 'applied')
          if ($applied.Count -ne 1) { throw 'MSYS2 transaction was not applied' }
          $transactionId = $applied[0].receipt.transaction_id

          @('', 'n') | & $binary tui --offline --tool msys2 --scope msys2=system | Set-Content -Encoding utf8 tui.txt
          if (-not ((Get-Content tui.txt) -match 'mirror=(aliyun|huaweicloud|nju|sjtug|tuna|ustc)')) { throw 'MSYS2 TUI mirror missing' }
          (& $binary restore $transactionId --yes --json) | Set-Content -Encoding utf8 restore.json
          $restore = Get-Content restore.json -Raw | ConvertFrom-Json
          if (-not $restore.receipt.verified) { throw 'MSYS2 restore failed' }

          if ((Get-FileHash $msys -Algorithm SHA256).Hash -ne $msysBefore) { throw 'MSYS mirrorlist was not restored' }
          if ((Get-FileHash $mingw -Algorithm SHA256).Hash -ne $mingwBefore) { throw 'MinGW mirrorlist was not restored' }
      - name: Save redacted boundary evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: msys2-boundary-${{ matrix.arch }}-${{ github.run_id }}
          path: |
            plan.json
            apply.json
            status.json
            restore.json
            tui.txt
          if-no-files-found: warn
          retention-days: 7
