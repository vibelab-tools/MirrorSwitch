name: Maven macOS and Windows live boundary

on:
  schedule:
    - cron: "5 4 * * 3"
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_TOOLCHAIN: 1.88.0

jobs:
  native:
    name: Maven (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: macOS x86_64, runner: macos-15-intel }
          - { name: macOS arm64, runner: macos-15 }
          - { name: Windows x86_64, runner: windows-2025 }
          - { name: Windows arm64, runner: windows-11-arm }
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - name: Install Rust toolchain
        shell: bash
        run: |
          mvn --version
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal
          rustup default "$RUST_TOOLCHAIN"
      - name: Restore shared Rust dependency cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: native-boundary-v2
          key: ${{ hashFiles('Cargo.toml', 'Cargo.lock', 'src/**/*.rs', 'tests/**/*.rs') }}
          add-job-id-key: "false"
          cache-workspace-crates: "true"
          cache-bin: "false"
          cache-on-failure: "true"
      - name: Run deterministic Maven boundary
        run: cargo test --locked --test maven_adapter_boundary --test transaction_boundary --test restore_dispatch_boundary -- --test-threads=1
      - name: Build native release executable
        run: cargo build --locked --release --bin mirrorswitch
      - name: Exercise macOS settings, frontends, dependency, and recovery
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -Eeuo pipefail
          binary="$PWD/target/release/mirrorswitch"; boundary="$RUNNER_TEMP/mirrorswitch-maven-boundary"; export HOME="$boundary/home"
          unset MAVEN_ARGS
          export MAVEN_OPTS="-Duser.home=$HOME"
          project="$HOME/project"; settings="$HOME/.m2/settings.xml"; mkdir -p "$project" "$(dirname "$settings")"
          printf '%s\n' '<settings><mirrors><mirror><id>private-external</id><url>https://packages.invalid.example/maven/</url><mirrorOf>external:*,!central</mirrorOf></mirror></mirrors><servers><server><id>private</id><username>fixture</username><password>fixture-only</password></server></servers></settings>' > "$settings"
          chmod 0600 "$settings"
          printf '%s\n' '<project><modelVersion>4.0.0</modelVersion><groupId>test</groupId><artifactId>native-probe</artifactId><version>1.0.0</version></project>' > "$project/pom.xml"
          printf '{"version":1,"tools":[{"id":"maven","scope":"user"}]}\n' > "$project/request.json"
          before=$(shasum -a 256 "$settings"|awk '{print $1}'); project_before=$(shasum -a 256 "$project/pom.xml"|awk '{print $1}'); mode=$(stat -f '%Lp' "$settings")
          cd "$project"
          "$binary" status --offline --json > status.json; "$binary" plan --offline --tool maven --scope maven=user --json > plan-cli.json; "$binary" plan --offline --config request.json --json > plan-config.json
          python3 - <<'PY'
          import json
          s=json.load(open('status.json')); assert [t['adapter_key'] for t in s['detected_tools'] if t['adapter_key']=='maven']==['maven']
          a=json.load(open('plan-cli.json')); b=json.load(open('plan-config.json')); assert a['ok'] and b['ok'] and a['plan']['tools'][0]['plan']==b['plan']['tools'][0]['plan']
          PY
          printf '\nn\n'|"$binary" tui --offline --tool maven --scope maven=user > tui.txt; grep -E 'mirror=(aliyun|huaweicloud|nju)' tui.txt
          "$binary" apply --offline --config request.json --yes --json > apply.json
          id=$(python3 - <<'PY'
          import json
          r=json.load(open('apply.json'))['result']; assert r['successful']; a=[t for t in r['tools'] if t['status']=='applied']; assert len(a)==1; print(a[0]['receipt']['transaction_id'])
          PY
          )
          "$binary" apply --offline --config request.json --yes --json > idempotent.json; "$binary" restore "$id" --yes --json > restore.json
          python3 - <<'PY'
          import json
          a=json.load(open('idempotent.json'))['result']; r=json.load(open('restore.json')); assert a['successful'] and not [t for t in a['tools'] if t['status']=='applied']; assert r['adapter_key']=='maven' and r['receipt']['verified']
          PY
          test "$before" = "$(shasum -a 256 "$settings"|awk '{print $1}')"; test "$project_before" = "$(shasum -a 256 pom.xml|awk '{print $1}')"; test "$mode" = "$(stat -f '%Lp' "$settings")"
      - name: Exercise Windows settings, frontends, dependency, and recovery
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'; $binary=Join-Path $PWD 'target/release/mirrorswitch.exe'; $boundary=Join-Path $env:RUNNER_TEMP 'mirrorswitch-maven-boundary'
          $env:USERPROFILE=Join-Path $boundary 'home'; $env:HOME=$env:USERPROFILE; $env:LOCALAPPDATA=Join-Path $env:USERPROFILE 'AppData/Local'; Remove-Item Env:MAVEN_ARGS -ErrorAction SilentlyContinue; $env:MAVEN_OPTS="-Duser.home=$env:USERPROFILE"
          $project=Join-Path $env:USERPROFILE 'project'; $settings=Join-Path $env:USERPROFILE '.m2/settings.xml'; New-Item -ItemType Directory -Force $project,(Split-Path $settings),$env:LOCALAPPDATA|Out-Null
          $xml="<?xml version=`"1.0`" encoding=`"UTF-8`"?>`r`n<settings><mirrors><mirror><id>private-external</id><url>https://packages.invalid.example/maven/</url><mirrorOf>external:*,!central</mirrorOf></mirror></mirrors><servers><server><id>private</id><username>fixture</username><password>fixture-only</password></server></servers></settings>`r`n"
          [IO.File]::WriteAllText($settings,$xml,[Text.UTF8Encoding]::new($true))
          '<project><modelVersion>4.0.0</modelVersion><groupId>test</groupId><artifactId>native-probe</artifactId><version>1.0.0</version></project>'|Set-Content -Encoding utf8 (Join-Path $project 'pom.xml'); '{"version":1,"tools":[{"id":"maven","scope":"user"}]}'|Set-Content -Encoding utf8 (Join-Path $project 'request.json')
          $before=(Get-FileHash $settings -Algorithm SHA256).Hash; $projectBefore=(Get-FileHash (Join-Path $project 'pom.xml') -Algorithm SHA256).Hash
          Push-Location $project
          try{
            (& $binary status --offline --json)|Set-Content -Encoding utf8 status.json; (& $binary plan --offline --tool maven --scope maven=user --json)|Set-Content -Encoding utf8 plan-cli.json; (& $binary plan --offline --config request.json --json)|Set-Content -Encoding utf8 plan-config.json
            $s=Get-Content status.json -Raw|ConvertFrom-Json; if(@($s.detected_tools|Where-Object adapter_key -eq 'maven').Count -ne 1){throw 'Maven not detected'}
            $a=Get-Content plan-cli.json -Raw|ConvertFrom-Json; $b=Get-Content plan-config.json -Raw|ConvertFrom-Json; if(-not $a.ok -or -not $b.ok -or -not [string]::Equals([string]($a.plan.tools[0].plan|ConvertTo-Json -Depth 100 -Compress), [string]($b.plan.tools[0].plan|ConvertTo-Json -Depth 100 -Compress))){throw 'frontend plans differ'}
            @('','n')|& $binary tui --offline --tool maven --scope maven=user|Set-Content -Encoding utf8 tui.txt; if(-not((Get-Content tui.txt)-match 'mirror=(aliyun|huaweicloud|nju)')){throw 'Maven mirror missing'}
            (& $binary apply --offline --config request.json --yes --json)|Set-Content -Encoding utf8 apply.json; $r=Get-Content apply.json -Raw|ConvertFrom-Json; if(-not $r.result.successful){throw 'Maven apply failed'}; $applied=@($r.result.tools|Where-Object status -eq 'applied'); if($applied.Count -ne 1){throw 'transaction missing'}; $id=$applied[0].receipt.transaction_id
            (& $binary apply --offline --config request.json --yes --json)|Set-Content -Encoding utf8 idempotent.json; $again=Get-Content idempotent.json -Raw|ConvertFrom-Json; if(-not $again.result.successful -or @($again.result.tools|Where-Object status -eq 'applied').Count -ne 0){throw 'not idempotent'}
            (& $binary restore $id --yes --json)|Set-Content -Encoding utf8 restore.json; $restore=Get-Content restore.json -Raw|ConvertFrom-Json; if(-not $restore.receipt.verified -or $restore.adapter_key -ne 'maven'){throw 'restore failed'}
          }finally{Pop-Location}
          if($before -ne (Get-FileHash $settings -Algorithm SHA256).Hash -or $projectBefore -ne (Get-FileHash (Join-Path $project 'pom.xml') -Algorithm SHA256).Hash){throw 'Maven config not restored exactly'}
      - name: Save redacted boundary evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: maven-native-${{ matrix.name }}-${{ github.run_id }}
          path: ${{ runner.temp }}/mirrorswitch-maven-boundary/home/project/*.json
          if-no-files-found: warn
          retention-days: 7
