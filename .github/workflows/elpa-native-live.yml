name: ELPA macOS and Windows live boundary

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_TOOLCHAIN: 1.88.0

jobs:
  native:
    name: ELPA (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: macOS x86_64, runner: macos-15-intel }
          - { name: macOS arm64, runner: macos-15 }
          - { name: Windows x86_64, runner: windows-2025 }
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: jcs090218/setup-emacs@v3
        with:
          version: "30.2"
      - name: Install Rust toolchain
        shell: bash
        run: |
          emacs --version
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal
          rustup default "$RUST_TOOLCHAIN"
      - name: Restore shared Rust dependency cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: native-boundary-v2
          key: ${{ hashFiles('Cargo.toml', 'Cargo.lock', 'src/**/*.rs', 'tests/**/*.rs') }}
          add-job-id-key: "false"
          cache-workspace-crates: "true"
          cache-bin: "false"
          cache-on-failure: "true"
      - name: Run deterministic ELPA boundary
        run: cargo test --locked --test elpa_adapter_boundary --test transaction_boundary --test restore_dispatch_boundary -- --test-threads=1
      - name: Build native release executable
        run: cargo build --locked --release --bin mirrorswitch
      - name: Exercise macOS native init hierarchy, frontends, refresh, and recovery
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -Eeuo pipefail
          binary="$PWD/target/release/mirrorswitch"; boundary="$RUNNER_TEMP/mirrorswitch-elpa-boundary"; export HOME="$boundary/home"; unset XDG_CONFIG_HOME
          project="$HOME/project"; emacs_dir=$(emacs --batch -Q --eval '(princ (expand-file-name user-emacs-directory))'); init="$emacs_dir/init.el"; mkdir -p "$emacs_dir" "$project"
          printf '%s\n' ';; native user policy' '(setq custom-file "~/.emacs.d/private.el")' '(setq package-archives '\''(("private" . "https://build:fixture-only@packages.invalid.example/elpa/")))' '(setq package-archive-priorities '\''(("private" . 100)))' > "$init"; chmod 0600 "$init"
          printf '%s\n' '((nil . ((private-token . "project-fixture-only"))))' > "$project/.dir-locals.el"; chmod 0400 "$project/.dir-locals.el"
          printf '{"version":1,"tools":[{"id":"elpa","scope":"user"}]}\n' > "$project/request.json"
          before=$(shasum -a 256 "$init"|awk '{print $1}'); project_before=$(shasum -a 256 "$project/.dir-locals.el"|awk '{print $1}'); mode=$(stat -f '%Lp' "$init")
          cd "$project"
          "$binary" status --offline --json > status.json; "$binary" plan --offline --tool elpa --scope elpa=user --json > plan-cli.json; "$binary" plan --offline --config request.json --json > plan-config.json
          python3 - "$init" "$emacs_dir" <<'PY'
          import json, pathlib, sys
          status=json.load(open('status.json')); tools=[t for t in status['detected_tools'] if t['adapter_key']=='elpa']; assert len(tools)==1
          evidence='\n'.join(tools[0]['detected']['evidence']); assert sys.argv[1] in evidence and sys.argv[2].rstrip('/') in evidence and str(pathlib.Path.cwd()) in evidence and 'Macos' in evidence
          a=json.load(open('plan-cli.json')); b=json.load(open('plan-config.json')); assert a['ok'] and b['ok'] and a['plan']['tools'][0]['plan']==b['plan']['tools'][0]['plan']
          assert 'fixture-only' not in pathlib.Path('status.json').read_text()+pathlib.Path('plan-cli.json').read_text()+pathlib.Path('plan-config.json').read_text()
          PY
          printf '\nn\n'|"$binary" tui --offline --tool elpa --scope elpa=user > tui.txt; grep -E 'mirror=(nju|tuna|ustc)' tui.txt; ! grep -F 'fixture-only' tui.txt
          "$binary" apply --offline --config request.json --yes --json > apply.json
          id=$(python3 - <<'PY'
          import json
          r=json.load(open('apply.json'))['result']; assert r['successful']; a=[t for t in r['tools'] if t['status']=='applied']; assert len(a)==1; print(a[0]['receipt']['transaction_id'])
          PY
          )
          emacs --batch -Q --load "$init" --eval '(progn (dolist (name '\''("gnu" "nongnu" "melpa")) (unless (string-match-p "mirrors\\.\\(nju\\|tuna\\|ustc\\)" (cdr (assoc name package-archives))) (error "archive mismatch: %s" name))) (princ "MIRRORSWITCH_ELPA_NATIVE=ok"))'|grep -F MIRRORSWITCH_ELPA_NATIVE=ok
          "$binary" apply --offline --config request.json --yes --json > idempotent.json; "$binary" restore "$id" --yes --json > restore.json
          python3 - <<'PY'
          import json
          a=json.load(open('idempotent.json'))['result']; r=json.load(open('restore.json')); assert a['successful'] and not [t for t in a['tools'] if t['status']=='applied']; assert r['adapter_key']=='elpa' and r['receipt']['verified']
          PY
          test "$before" = "$(shasum -a 256 "$init"|awk '{print $1}')"; test "$project_before" = "$(shasum -a 256 .dir-locals.el|awk '{print $1}')"; test "$mode" = "$(stat -f '%Lp' "$init")"; test ! -e "$emacs_dir/mirrorswitch/verification/elpa"
      - name: Exercise Windows native init hierarchy, frontends, refresh, and recovery
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'; $binary=Join-Path $PWD 'target/release/mirrorswitch.exe'; $boundary=Join-Path $env:RUNNER_TEMP 'mirrorswitch-elpa-boundary'
          $env:USERPROFILE=Join-Path $boundary 'home'; $env:HOME=$env:USERPROFILE; $env:APPDATA=Join-Path $env:USERPROFILE 'AppData/Roaming'; $env:LOCALAPPDATA=Join-Path $env:USERPROFILE 'AppData/Local'; Remove-Item Env:XDG_CONFIG_HOME -ErrorAction SilentlyContinue; New-Item -ItemType Directory -Force $env:USERPROFILE,$env:APPDATA,$env:LOCALAPPDATA|Out-Null
          $native=((& emacs --batch -Q --eval '(princ (format "%s|%s" system-type system-configuration))') -join '').Trim(); if($native -notmatch '^windows-nt\|x86_64'){throw "Emacs is not native Windows x64: $native"}
          $emacsDir=((& emacs --batch -Q --eval '(princ (expand-file-name user-emacs-directory))') -join '').Trim(); $init=Join-Path $emacsDir 'init.el'; $project=Join-Path $env:USERPROFILE 'project'; New-Item -ItemType Directory -Force $emacsDir,$project|Out-Null
          $contents=";; native user policy`r`n(setq custom-file `"~/.emacs.d/private.el`")`r`n(setq package-archives '((`"private`" . `"https://build:fixture-only@packages.invalid.example/elpa/`")))`r`n(setq package-archive-priorities '((`"private`" . 100)))`r`n"; [IO.File]::WriteAllText($init,$contents,[Text.UTF8Encoding]::new($true))
          [IO.File]::WriteAllText((Join-Path $project '.dir-locals.el'),'((nil . ((private-token . "project-fixture-only"))))',[Text.UTF8Encoding]::new($false)); Set-ItemProperty (Join-Path $project '.dir-locals.el') IsReadOnly $true; [IO.File]::WriteAllText((Join-Path $project 'request.json'),'{"version":1,"tools":[{"id":"elpa","scope":"user"}]}',[Text.UTF8Encoding]::new($false))
          $before=(Get-FileHash $init -Algorithm SHA256).Hash; $projectBefore=(Get-FileHash (Join-Path $project '.dir-locals.el') -Algorithm SHA256).Hash
          Push-Location $project
          try{
            (& $binary status --offline --json)|Set-Content -Encoding utf8 status.json; (& $binary plan --offline --tool elpa --scope elpa=user --json)|Set-Content -Encoding utf8 plan-cli.json; (& $binary plan --offline --config request.json --json)|Set-Content -Encoding utf8 plan-config.json
            $s=Get-Content status.json -Raw|ConvertFrom-Json; $tools=@($s.detected_tools|Where-Object adapter_key -eq 'elpa'); if($tools.Count -ne 1){throw 'ELPA not detected'}; $evidence=$tools[0].detected.evidence -join "`n"; if(-not $evidence.Contains($init) -or -not $evidence.Contains($emacsDir.TrimEnd('/','\')) -or -not $evidence.Contains($project) -or -not $evidence.Contains('Windows') -or -not $evidence.Contains('x86_64')){throw 'native path/platform evidence missing'}
            $a=Get-Content plan-cli.json -Raw|ConvertFrom-Json; $b=Get-Content plan-config.json -Raw|ConvertFrom-Json; if(-not $a.ok -or -not $b.ok -or -not [string]::Equals([string]($a.plan.tools[0].plan|ConvertTo-Json -Depth 100 -Compress), [string]($b.plan.tools[0].plan|ConvertTo-Json -Depth 100 -Compress)) -or (Get-Content status.json,plan-cli.json,plan-config.json -Raw)-match 'fixture-only'){throw 'frontend plans differ or private policy leaked'}
            @('','n')|& $binary tui --offline --tool elpa --scope elpa=user|Set-Content -Encoding utf8 tui.txt; if(-not((Get-Content tui.txt)-match 'mirror=(nju|tuna|ustc)') -or (Get-Content tui.txt -Raw).Contains('fixture-only')){throw 'TUI output invalid'}
            (& $binary apply --offline --config request.json --yes --json)|Set-Content -Encoding utf8 apply.json; $r=Get-Content apply.json -Raw|ConvertFrom-Json; if(-not $r.result.successful){throw 'ELPA apply failed'}; $applied=@($r.result.tools|Where-Object status -eq 'applied'); if($applied.Count -ne 1){throw 'transaction missing'}; $id=$applied[0].receipt.transaction_id
            $script="(progn (dolist (name '(`"gnu`" `"nongnu`" `"melpa`")) (unless (string-match-p `"mirrors\\.\\(nju\\|tuna\\|ustc\\)`" (cdr (assoc name package-archives))) (error `"archive mismatch: %s`" name))) (princ `"MIRRORSWITCH_ELPA_NATIVE=ok`"))"; & emacs --batch -Q --load $init --eval $script; if($LASTEXITCODE -ne 0){throw 'native archive query failed'}
            (& $binary apply --offline --config request.json --yes --json)|Set-Content -Encoding utf8 idempotent.json; $again=Get-Content idempotent.json -Raw|ConvertFrom-Json; if(-not $again.result.successful -or @($again.result.tools|Where-Object status -eq 'applied').Count -ne 0){throw 'not idempotent'}; (& $binary restore $id --yes --json)|Set-Content -Encoding utf8 restore.json; $restore=Get-Content restore.json -Raw|ConvertFrom-Json; if(-not $restore.receipt.verified -or $restore.adapter_key -ne 'elpa'){throw 'restore failed'}
          }finally{Pop-Location}
          $bytes=[IO.File]::ReadAllBytes($init); if($before -ne (Get-FileHash $init -Algorithm SHA256).Hash -or $projectBefore -ne (Get-FileHash (Join-Path $project '.dir-locals.el') -Algorithm SHA256).Hash -or $bytes[0] -ne 0xEF -or $bytes[1] -ne 0xBB -or $bytes[2] -ne 0xBF -or (Test-Path (Join-Path $emacsDir 'mirrorswitch/verification/elpa'))){throw 'ELPA state not restored exactly'}
      - name: Save redacted boundary evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: elpa-native-${{ matrix.name }}-${{ github.run_id }}
          path: ${{ runner.temp }}/mirrorswitch-elpa-boundary/home/project/*.json
          if-no-files-found: warn
          retention-days: 7
