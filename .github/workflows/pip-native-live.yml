name: pip macOS and Windows live boundary

on:
  schedule:
    - cron: "7 1 * * 3"
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_TOOLCHAIN: 1.88.0

jobs:
  native:
    name: pip (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS x86_64
            runner: macos-15-intel
            python_arch: x64
          - name: macOS arm64
            runner: macos-15
            python_arch: arm64
          - name: Windows x86_64
            runner: windows-2025
            python_arch: x64
          - name: Windows arm64
            runner: windows-11-arm
            python_arch: arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
      - name: Install Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          architecture: ${{ matrix.python_arch }}
      - name: Install Rust toolchain
        shell: bash
        run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal
          rustup default "$RUST_TOOLCHAIN"
      - name: Restore shared Rust dependency cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: native-boundary
          add-job-id-key: "false"
          cache-bin: "false"
          cache-on-failure: "true"
      - name: Run deterministic pip adapter boundary
        run: cargo test --locked --test pip_adapter_boundary --test transaction_boundary --test restore_dispatch_boundary -- --test-threads=1
      - name: Build native release executable
        run: cargo build --locked --release --bin mirrorswitch
      - name: Exercise macOS paths, frontends, client query, and recovery
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -Eeuo pipefail
          binary="$PWD/target/release/mirrorswitch"
          boundary="$RUNNER_TEMP/mirrorswitch-pip-boundary"
          export HOME="$boundary/home"
          unset PIP_CONFIG_FILE PIP_INDEX_URL PIP_EXTRA_INDEX_URL PIP_TRUSTED_HOST PIP_CERT PIP_PROXY
          project="$boundary/project"
          user_config="$HOME/Library/Application Support/pip/pip.conf"
          mkdir -p "$(dirname "$user_config")" "$project"
          printf '[global]\nindex-url = https://pypi.org/simple/\ntimeout = 15\n' > "$user_config"
          chmod 0600 "$user_config"
          printf '{"version":1,"tools":[{"id":"pip","scope":"user"}]}\n' > "$project/request.json"

          user_before=$(shasum -a 256 "$user_config" | awk '{print $1}')
          mode_before=$(stat -f '%Lp' "$user_config")
          system_before=$(
            for path in '/etc/pip.conf' '/Library/Application Support/pip/pip.conf'; do
              if [ -f "$path" ]; then shasum -a 256 "$path"; fi
            done
          )

          cd "$project"
          "$binary" status --offline --json > status.json
          "$binary" plan --offline --tool pip --scope pip=user --json > plan-cli.json
          "$binary" plan --offline --config request.json --json > plan-config.json
          python3 - <<'PY'
          import json
          status = json.load(open('status.json'))
          assert [tool['adapter_key'] for tool in status['detected_tools'] if tool['adapter_key'] == 'pip'] == ['pip']
          cli = json.load(open('plan-cli.json'))
          config = json.load(open('plan-config.json'))
          assert cli['ok'] and config['ok']
          assert len(cli['plan']['tools']) == len(config['plan']['tools']) == 1
          assert cli['plan']['tools'][0]['plan'] == config['plan']['tools'][0]['plan']
          PY
          printf '\nn\n' | "$binary" tui --offline --tool pip --scope pip=user > tui.txt
          grep -E 'mirror=(aliyun|huaweicloud|nju|sjtug|tuna|ustc)' tui.txt

          "$binary" apply --offline --config request.json --yes --json > apply.json
          transaction_id=$(python3 - <<'PY'
          import json
          report = json.load(open('apply.json'))['result']
          assert report['successful'] is True
          applied = [tool for tool in report['tools'] if tool['status'] == 'applied']
          assert len(applied) == 1
          print(applied[0]['receipt']['transaction_id'])
          PY
          )
          "$binary" apply --offline --config request.json --yes --json > idempotent.json
          python3 - <<'PY'
          import json
          report = json.load(open('idempotent.json'))['result']
          assert report['successful'] is True
          assert not [tool for tool in report['tools'] if tool['status'] == 'applied']
          PY
          "$binary" restore "$transaction_id" --yes --json > restore.json
          python3 - <<'PY'
          import json
          result = json.load(open('restore.json'))
          assert result['adapter_key'] == 'pip'
          assert result['receipt']['verified'] is True
          PY

          test "$user_before" = "$(shasum -a 256 "$user_config" | awk '{print $1}')"
          test "$mode_before" = "$(stat -f '%Lp' "$user_config")"
          system_after=$(
            for path in '/etc/pip.conf' '/Library/Application Support/pip/pip.conf'; do
              if [ -f "$path" ]; then shasum -a 256 "$path"; fi
            done
          )
          test "$system_before" = "$system_after"
      - name: Exercise Windows paths, frontends, client query, and recovery
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $binary = Join-Path $PWD 'target/release/mirrorswitch.exe'
          $boundary = Join-Path $env:RUNNER_TEMP 'mirrorswitch-pip-boundary'
          $env:APPDATA = Join-Path $boundary 'AppData/Roaming'
          $env:LOCALAPPDATA = Join-Path $boundary 'AppData/Local'
          $env:ProgramData = Join-Path $boundary 'ProgramData'
          Remove-Item Env:PIP_CONFIG_FILE, Env:PIP_INDEX_URL, Env:PIP_EXTRA_INDEX_URL, Env:PIP_TRUSTED_HOST, Env:PIP_CERT, Env:PIP_PROXY -ErrorAction SilentlyContinue
          $project = Join-Path $boundary 'project'
          $userConfig = Join-Path $env:APPDATA 'pip/pip.ini'
          New-Item -ItemType Directory -Force (Split-Path $userConfig), $env:LOCALAPPDATA, $env:ProgramData, $project | Out-Null
          $text = "[global]`r`nindex-url = https://pypi.org/simple/`r`ntimeout = 15`r`n"
          [System.IO.File]::WriteAllText($userConfig, $text, [System.Text.UTF8Encoding]::new($true))
          '{"version":1,"tools":[{"id":"pip","scope":"user"}]}' | Set-Content -Encoding utf8 (Join-Path $project 'request.json')

          $userBefore = (Get-FileHash $userConfig -Algorithm SHA256).Hash
          $aclBefore = (Get-Acl $userConfig).Sddl
          $systemConfig = Join-Path $env:ProgramData 'pip/pip.ini'
          $systemBefore = if (Test-Path $systemConfig) { (Get-FileHash $systemConfig -Algorithm SHA256).Hash } else { '' }

          Push-Location $project
          try {
            (& $binary status --offline --json) | Set-Content -Encoding utf8 status.json
            (& $binary plan --offline --tool pip --scope pip=user --json) | Set-Content -Encoding utf8 plan-cli.json
            (& $binary plan --offline --config request.json --json) | Set-Content -Encoding utf8 plan-config.json
            $status = Get-Content status.json -Raw | ConvertFrom-Json
            if (@($status.detected_tools | Where-Object adapter_key -eq 'pip').Count -ne 1) { throw 'pip adapter was not detected' }
            $cli = Get-Content plan-cli.json -Raw | ConvertFrom-Json
            $config = Get-Content plan-config.json -Raw | ConvertFrom-Json
            if (-not $cli.ok -or -not $config.ok) { throw 'pip plan was not actionable' }
            if (($cli.plan.tools[0].plan | ConvertTo-Json -Depth 100 -Compress) -ne ($config.plan.tools[0].plan | ConvertTo-Json -Depth 100 -Compress)) {
              throw 'CLI and configuration frontends produced different pip plans'
            }
            @('', 'n') | & $binary tui --offline --tool pip --scope pip=user | Set-Content -Encoding utf8 tui.txt
            if (-not ((Get-Content tui.txt) -match 'mirror=(aliyun|huaweicloud|nju|sjtug|tuna|ustc)')) { throw 'pip TUI mirror missing' }

            (& $binary apply --offline --config request.json --yes --json) | Set-Content -Encoding utf8 apply.json
            $apply = Get-Content apply.json -Raw | ConvertFrom-Json
            if (-not $apply.result.successful) { throw 'pip apply or native query failed' }
            $applied = @($apply.result.tools | Where-Object status -eq 'applied')
            if ($applied.Count -ne 1) { throw 'pip transaction was not applied' }
            $transactionId = $applied[0].receipt.transaction_id

            (& $binary apply --offline --config request.json --yes --json) | Set-Content -Encoding utf8 idempotent.json
            $idempotent = Get-Content idempotent.json -Raw | ConvertFrom-Json
            if (-not $idempotent.result.successful -or @($idempotent.result.tools | Where-Object status -eq 'applied').Count -ne 0) {
              throw 'second pip apply was not idempotent'
            }
            (& $binary restore $transactionId --yes --json) | Set-Content -Encoding utf8 restore.json
            $restore = Get-Content restore.json -Raw | ConvertFrom-Json
            if (-not $restore.receipt.verified -or $restore.adapter_key -ne 'pip') { throw 'adapter-aware pip restore failed' }
          } finally {
            Pop-Location
          }

          if ($userBefore -ne (Get-FileHash $userConfig -Algorithm SHA256).Hash) { throw 'UTF-8 BOM/CRLF user config was not restored exactly' }
          if ($aclBefore -ne (Get-Acl $userConfig).Sddl) { throw 'pip user config ACL changed' }
          $systemAfter = if (Test-Path $systemConfig) { (Get-FileHash $systemConfig -Algorithm SHA256).Hash } else { '' }
          if ($systemBefore -ne $systemAfter) { throw 'pip machine config changed' }
      - name: Save redacted boundary evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: pip-native-boundary-${{ runner.os }}-${{ matrix.python_arch }}-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/mirrorswitch-pip-boundary/project/status.json
            ${{ runner.temp }}/mirrorswitch-pip-boundary/project/plan-cli.json
            ${{ runner.temp }}/mirrorswitch-pip-boundary/project/plan-config.json
            ${{ runner.temp }}/mirrorswitch-pip-boundary/project/apply.json
            ${{ runner.temp }}/mirrorswitch-pip-boundary/project/idempotent.json
            ${{ runner.temp }}/mirrorswitch-pip-boundary/project/restore.json
            ${{ runner.temp }}/mirrorswitch-pip-boundary/project/tui.txt
          if-no-files-found: warn
          retention-days: 7
