[package]
name = "mirrorswitch"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "MIT"
description = "Safe per-tool mirror selection for development repositories"
repository = "https://github.com/vibelab-tools/MirrorSwitch"

[dependencies]
libc = "0.2"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }
roxmltree = "0.21.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["preserve_order"] }
sha2 = "0.10"
tempfile = "3.20"
thiserror = "2.0"
toml_edit = "0.25.13"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_Storage_FileSystem", "Win32_System_Registry", "Win32_System_Threading"] }
