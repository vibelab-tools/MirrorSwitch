[package]
name = "mirrorswitch"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
description = "Safe per-tool mirror selection for development repositories"
repository = "https://github.com/vibelab-tools/MirrorSwitch"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
thiserror = "2.0"

[dev-dependencies]
serde_json = "1.0"
